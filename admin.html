<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/LOGO-transparent.png" type="image/png" />
    <title>관리자 페이지 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .admin-page {
        max-width: 1080px;
      }
      .admin-top-logo {
        display: inline-flex;
        margin-bottom: 1.2rem;
      }
      .admin-top-logo img {
        width: 74px;
        height: auto;
        display: block;
      }
      .admin-login-grid {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 0.7rem;
        align-items: end;
      }
      .admin-login-grid .confirm-label {
        margin: 0;
      }
      .admin-table-wrap {
        margin-top: 1rem;
        overflow-x: auto;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 920px;
      }
      .admin-table th,
      .admin-table td {
        border-bottom: 1px solid #e6e1da;
        padding: 0.6rem 0.5rem;
        text-align: left;
        font-size: 0.93rem;
      }
      .admin-status-pending {
        color: #8c8c8c;
        font-weight: 600;
      }
      .admin-status-confirmed {
        color: var(--grafford-mud);
        font-weight: 700;
      }
      .admin-confirm-btn {
        border: 1px solid transparent;
        background-color: var(--grafford-beige2);
        color: #fff;
        padding: 0.34rem 0.8rem;
        cursor: pointer;
      }
      .admin-confirm-btn:disabled {
        background-color: #c8c8c8;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="content-section confirm-page admin-page">
      <a href="index.html" class="admin-top-logo" aria-label="메인으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <h1 class="confirm-title">관리자 페이지</h1>
      <section class="confirm-section" aria-labelledby="admin-login-title">
        <h2 class="confirm-section-title" id="admin-login-title">관리자 로그인</h2>
        <form id="admin-login-form" class="admin-login-grid">
          <label class="confirm-label">
            <span>ID</span>
            <input id="admin-id" type="text" autocomplete="username" required />
          </label>
          <label class="confirm-label">
            <span>PW</span>
            <input
              id="admin-pw"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit" class="btn reserve-btn">조회</button>
        </form>
        <p class="confirm-back" id="admin-message" hidden></p>
      </section>

      <section
        class="confirm-section"
        id="admin-table-section"
        aria-labelledby="admin-table-title"
        hidden
      >
        <h2 class="confirm-section-title" id="admin-table-title">무통장 예약 목록</h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>예약번호</th>
                <th>예약자</th>
                <th>연락처</th>
                <th>객실</th>
                <th>체크인/체크아웃</th>
                <th>총 금액</th>
                <th>입금 상태</th>
                <th>처리</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var loginForm = document.getElementById("admin-login-form");
        var idInput = document.getElementById("admin-id");
        var pwInput = document.getElementById("admin-pw");
        var msgEl = document.getElementById("admin-message");
        var tableSection = document.getElementById("admin-table-section");
        var tableBody = document.getElementById("admin-table-body");

        function adminApiUrl() {
          var base = "";
          if (typeof window !== "undefined" && window.__GRAFFORD_API_BASE__) {
            base = String(window.__GRAFFORD_API_BASE__).replace(/\/$/, "");
          }
          return base + "/api/admin-bank-reservations";
        }

        function showMessage(text) {
          if (!msgEl) {
            return;
          }
          if (!text) {
            msgEl.hidden = true;
            msgEl.textContent = "";
            return;
          }
          msgEl.hidden = false;
          msgEl.textContent = text;
        }

        function formatKRW(n) {
          return Number(n || 0).toLocaleString("ko-KR") + "원";
        }

        function getAuthPayload() {
          return {
            adminId: String(idInput.value || "").trim(),
            adminPw: String(pwInput.value || "").trim(),
          };
        }

        function renderRows(rows) {
          if (!tableBody) {
            return;
          }
          tableBody.innerHTML = "";
          if (!rows || !rows.length) {
            var emptyTr = document.createElement("tr");
            var emptyTd = document.createElement("td");
            emptyTd.colSpan = 8;
            emptyTd.textContent = "무통장 예약 내역이 없습니다.";
            emptyTr.appendChild(emptyTd);
            tableBody.appendChild(emptyTr);
            return;
          }
          rows.forEach(function (row) {
            var tr = document.createElement("tr");
            var statusLabel = row.bankConfirmed ? "입금확인" : "입금대기";
            var statusClass = row.bankConfirmed
              ? "admin-status-confirmed"
              : "admin-status-pending";

            tr.innerHTML =
              "<td>" +
              (row.reservationNumber || "—") +
              "</td>" +
              "<td>" +
              (row.guestName || "—") +
              "</td>" +
              "<td>" +
              (row.contact || "—") +
              "</td>" +
              "<td>" +
              (row.roomType || "—") +
              "</td>" +
              "<td>" +
              (row.checkIn || "—") +
              " ~ " +
              (row.checkOut || "—") +
              "</td>" +
              "<td>" +
              formatKRW(row.totalAmount || 0) +
              "</td>" +
              '<td><span class="' +
              statusClass +
              '">' +
              statusLabel +
              "</span></td>" +
              "<td></td>";

            var tdAction = tr.lastElementChild;
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "admin-confirm-btn";
            btn.textContent = "확정하기";
            btn.disabled = !!row.bankConfirmed;
            btn.addEventListener("click", function () {
              confirmReservation(row.reservationNumber, btn);
            });
            tdAction.appendChild(btn);
            tableBody.appendChild(tr);
          });
        }

        function loadList() {
          var auth = getAuthPayload();
          return fetch(adminApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "list",
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "목록 조회 실패");
              }
              tableSection.hidden = false;
              renderRows(result.data.rows || []);
              showMessage("");
            });
        }

        function confirmReservation(reservationNumber, buttonEl) {
          if (!reservationNumber) {
            return;
          }
          buttonEl.disabled = true;
          var auth = getAuthPayload();
          fetch(adminApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "confirm",
              reservationNumber: reservationNumber,
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "확정 처리 실패");
              }
              return loadList();
            })
            .catch(function (err) {
              buttonEl.disabled = false;
              showMessage(
                (err && err.message) || "확정 처리 중 오류가 발생했습니다.",
              );
            });
        }

        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!idInput.value.trim() || !pwInput.value.trim()) {
            showMessage("ID와 PW를 모두 입력해주세요.");
            return;
          }
          loadList().catch(function (err) {
            tableSection.hidden = true;
            renderRows([]);
            showMessage((err && err.message) || "조회 중 오류가 발생했습니다.");
          });
        });
      });
    </script>
  </body>
</html>
