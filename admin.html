<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/LOGO-transparent.png" type="image/png" />
    <title>관리자 페이지 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="content-section confirm-page admin-page">
      <a href="index.html" class="admin-top-logo" aria-label="메인으로 이동">
        <img src="images/LOGO-transparent.png" alt="GRAFFORD LOGO" />
      </a>
      <h1 class="confirm-title">관리자 페이지</h1>
      <nav
        id="admin-category-nav"
        class="admin-category-nav"
        aria-label="관리자 카테고리"
        hidden
      >
        <button type="button" class="admin-category-btn" data-admin-category="status">
          예약 현황
        </button>
        <button
          type="button"
          class="admin-category-btn is-active"
          data-admin-category="bank"
        >
          무통장 예약
        </button>
        <button type="button" class="admin-category-btn" data-admin-category="sales">
          매출 현황
        </button>
      </nav>
      <section
        class="confirm-section admin-login-section"
        aria-labelledby="admin-login-title"
      >
        <h2 class="confirm-section-title" id="admin-login-title">
          관리자 로그인
        </h2>
        <form
          id="admin-login-form"
          class="admin-login-form reserveinfo-form checkout-form"
          novalidate
        >
          <label class="confirm-label">
            ID
            <input
              id="admin-id"
              type="text"
              autocomplete="username"
              required
              placeholder="관리자 ID"
            />
          </label>
          <label class="confirm-label">
            PW
            <input
              id="admin-pw"
              type="password"
              autocomplete="current-password"
              required
              placeholder="관리자 비밀번호"
            />
          </label>
          <div class="confirm-actions admin-login-actions">
            <button type="submit" class="btn reserve-btn confirm-pay-submit">
              조회하기
            </button>
          </div>
        </form>
        <p class="confirm-back" id="admin-message" hidden></p>
      </section>

      <section
        class="confirm-section"
        id="admin-status-section"
        aria-labelledby="admin-status-title"
        hidden
      >
        <div class="admin-table-head">
          <h2 class="confirm-section-title" id="admin-status-title">예약 현황</h2>
          <div class="admin-calendar-nav">
            <button type="button" id="admin-calendar-prev" class="admin-page-btn">
              이전
            </button>
            <strong id="admin-calendar-label" class="admin-calendar-label">—</strong>
            <button type="button" id="admin-calendar-next" class="admin-page-btn">
              다음
            </button>
          </div>
        </div>
        <div class="admin-calendar-wrap">
          <div class="admin-calendar-weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span
            ><span>금</span><span>토</span>
          </div>
          <div id="admin-calendar-grid" class="admin-calendar-grid"></div>
          <p id="admin-calendar-help" class="admin-calendar-help">
            날짜별 숫자는 해당 날짜에 포함된 예약 건수입니다.
          </p>
        </div>
      </section>

      <section
        class="confirm-section"
        id="admin-bank-section"
        aria-labelledby="admin-bank-title"
        hidden
      >
        <div class="admin-table-head">
          <div class="admin-table-head-left">
            <h2 class="confirm-section-title" id="admin-bank-title">
              무통장 예약 목록
            </h2>
            <button
              type="button"
              id="admin-refresh-btn"
              class="btn reserve-btn admin-refresh-btn"
            >
              Refresh
            </button>
          </div>
          <label class="admin-sort-control" for="admin-sort-select">
            정렬 기준
            <select id="admin-sort-select">
              <option value="checkin">입실일</option>
              <option value="reservationDate">예약일</option>
              <option value="pendingFirst">입금상태(대기)</option>
              <option value="confirmedFirst">입금상태(확정)</option>
            </select>
          </label>
        </div>
        <form
          id="admin-search-form"
          class="admin-search-row"
          autocomplete="off"
        >
          <label class="confirm-label">
            예약자명
            <input
              id="admin-search-name"
              type="text"
              placeholder="예약자명으로 검색"
            />
          </label>
          <label class="confirm-label">
            연락처
            <input
              id="admin-search-contact"
              type="text"
              placeholder="연락처로 검색"
            />
          </label>
          <button type="submit" class="btn reserve-btn admin-search-btn">
            검색
          </button>
          <button
            type="button"
            id="admin-search-reset"
            class="btn admin-page-reset-btn"
          >
            초기화
          </button>
        </form>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>예약번호</th>
                <th>예약자</th>
                <th>연락처</th>
                <th>객실</th>
                <th>체크인/체크아웃</th>
                <th>총 금액</th>
                <th>입금 상태</th>
                <th>처리</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
        <div
          id="admin-pagination"
          class="admin-pagination"
          aria-label="목록 페이지"
        ></div>
      </section>

      <section
        class="confirm-section admin-empty-section"
        id="admin-sales-section"
        aria-labelledby="admin-sales-title"
        hidden
      >
        <h2 class="confirm-section-title" id="admin-sales-title">매출 현황</h2>
        <p class="confirm-info-text">매출 현황 레이아웃 준비 중입니다.</p>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var loginForm = document.getElementById("admin-login-form");
        var loginTitleEl = document.getElementById("admin-login-title");
        var idInput = document.getElementById("admin-id");
        var pwInput = document.getElementById("admin-pw");
        var msgEl = document.getElementById("admin-message");
        var categoryNav = document.getElementById("admin-category-nav");
        var categoryButtons = document.querySelectorAll(".admin-category-btn");
        var statusSection = document.getElementById("admin-status-section");
        var bankSection = document.getElementById("admin-bank-section");
        var salesSection = document.getElementById("admin-sales-section");
        var tableSection = bankSection;
        var tableBody = document.getElementById("admin-table-body");
        var sortSelect = document.getElementById("admin-sort-select");
        var refreshBtn = document.getElementById("admin-refresh-btn");
        var searchForm = document.getElementById("admin-search-form");
        var searchNameInput = document.getElementById("admin-search-name");
        var searchContactInput = document.getElementById(
          "admin-search-contact",
        );
        var searchResetBtn = document.getElementById("admin-search-reset");
        var paginationEl = document.getElementById("admin-pagination");
        var calendarPrevBtn = document.getElementById("admin-calendar-prev");
        var calendarNextBtn = document.getElementById("admin-calendar-next");
        var calendarLabel = document.getElementById("admin-calendar-label");
        var calendarGrid = document.getElementById("admin-calendar-grid");
        var latestRows = [];
        var currentPage = 1;
        var PAGE_SIZE = 20;
        var sortKey = "checkin";
        var activeCategory = "bank";
        var calendarViewDate = new Date();
        calendarViewDate.setDate(1);

        function dateKey(ymd) {
          return String(ymd || "").slice(0, 10);
        }

        function addOneDay(ymd) {
          var p = String(ymd || "").split("-");
          var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          d.setDate(d.getDate() + 1);
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }

        function expandNights(ci, co) {
          var out = [];
          var cur = dateKey(ci);
          var end = dateKey(co);
          while (cur && end && cur < end) {
            out.push(cur);
            cur = addOneDay(cur);
          }
          return out;
        }

        function getReservationCountByDate() {
          var counts = Object.create(null);
          (latestRows || []).forEach(function (row) {
            var ci = dateKey(row && row.checkIn);
            var co = dateKey(row && row.checkOut);
            expandNights(ci, co).forEach(function (d) {
              counts[d] = (counts[d] || 0) + 1;
            });
          });
          return counts;
        }

        function renderStatusCalendar() {
          if (!calendarGrid || !calendarLabel) {
            return;
          }
          var y = calendarViewDate.getFullYear();
          var m = calendarViewDate.getMonth();
          calendarLabel.textContent = y + "년 " + String(m + 1).padStart(2, "0") + "월";

          var counts = getReservationCountByDate();
          var first = new Date(y, m, 1);
          var startPad = first.getDay();
          var lastDay = new Date(y, m + 1, 0).getDate();
          calendarGrid.innerHTML = "";

          for (var i = 0; i < startPad; i += 1) {
            var empty = document.createElement("div");
            empty.className = "admin-calendar-cell is-empty";
            calendarGrid.appendChild(empty);
          }

          for (var day = 1; day <= lastDay; day += 1) {
            var dObj = new Date(y, m, day);
            var key =
              dObj.getFullYear() +
              "-" +
              String(dObj.getMonth() + 1).padStart(2, "0") +
              "-" +
              String(dObj.getDate()).padStart(2, "0");
            var cnt = counts[key] || 0;
            var cell = document.createElement("div");
            cell.className = "admin-calendar-cell" + (cnt > 0 ? " has-reservation" : "");
            var dayEl = document.createElement("span");
            dayEl.className = "admin-calendar-day";
            dayEl.textContent = String(day);
            var cntEl = document.createElement("strong");
            cntEl.className = "admin-calendar-count";
            cntEl.textContent = cnt > 0 ? String(cnt) : "—";
            cell.appendChild(dayEl);
            cell.appendChild(cntEl);
            calendarGrid.appendChild(cell);
          }
        }

        function setActiveCategory(category) {
          activeCategory = category;
          categoryButtons.forEach(function (btn) {
            btn.classList.toggle(
              "is-active",
              btn.getAttribute("data-admin-category") === category,
            );
          });
          statusSection.hidden = category !== "status";
          bankSection.hidden = category !== "bank";
          salesSection.hidden = category !== "sales";
          if (category === "status") {
            renderStatusCalendar();
          }
        }

        function adminApiUrl() {
          var base = "";
          if (typeof window !== "undefined" && window.__GRAFFORD_API_BASE__) {
            base = String(window.__GRAFFORD_API_BASE__).replace(/\/$/, "");
          }
          return base + "/api/admin-bank-reservations";
        }

        function showMessage(text) {
          if (!msgEl) {
            return;
          }
          if (!text) {
            msgEl.hidden = true;
            msgEl.textContent = "";
            return;
          }
          msgEl.hidden = false;
          msgEl.textContent = text;
        }

        function formatKRW(n) {
          return Number(n || 0).toLocaleString("ko-KR") + "원";
        }

        function parseDateValue(value) {
          var raw = String(value || "").trim();
          if (!raw) {
            return null;
          }
          var normalized = raw.replace(/\./g, "-").replace(/\//g, "-");
          var date = new Date(normalized);
          if (isNaN(date.getTime())) {
            return null;
          }
          return date;
        }

        function getStayPeriodNights(row) {
          var direct = Number(
            (row && (row.stayPeriod || row.stay_period)) || 0,
          );
          if (isFinite(direct) && direct > 0) {
            return Math.floor(direct);
          }
          var checkInDate = parseDateValue(row && row.checkIn);
          var checkOutDate = parseDateValue(row && row.checkOut);
          if (!checkInDate || !checkOutDate) {
            return 0;
          }
          var diffMs = checkOutDate.getTime() - checkInDate.getTime();
          var nights = Math.floor(diffMs / (24 * 60 * 60 * 1000));
          return nights > 0 ? nights : 0;
        }

        function getConsecutiveSaleTotal(row) {
          var baseTotal = Number((row && row.totalAmount) || 0);
          var nights = getStayPeriodNights(row);
          if (nights < 2) {
            return baseTotal;
          }
          var discount = (nights - 1) * 20000;
          return Math.max(0, baseTotal - discount);
        }

        function getAuthPayload() {
          return {
            adminId: String(idInput.value || "").trim(),
            adminPw: String(pwInput.value || "").trim(),
          };
        }

        function asYmdNumber(ymd) {
          var safe = String(ymd || "").replace(/\D/g, "");
          if (!safe) {
            return Number.MAX_SAFE_INTEGER;
          }
          return Number(safe);
        }

        function reservationDateNumber(row) {
          var raw = String((row && row.reservationNumber) || "").slice(0, 8);
          if (!/^\d{8}$/.test(raw)) {
            return Number.MAX_SAFE_INTEGER;
          }
          return Number(raw);
        }

        function normalizeSearchValue(v) {
          return String(v || "")
            .trim()
            .toLowerCase();
        }

        function getFilteredRows(rows) {
          var nameQuery = normalizeSearchValue(
            searchNameInput && searchNameInput.value,
          );
          var contactQuery = normalizeSearchValue(
            searchContactInput && searchContactInput.value,
          ).replace(/\s+/g, "");
          if (!nameQuery && !contactQuery) {
            return (rows || []).slice();
          }
          return (rows || []).filter(function (row) {
            var rowName = normalizeSearchValue(row && row.guestName);
            var rowContact = normalizeSearchValue(row && row.contact).replace(
              /\s+/g,
              "",
            );
            var nameOk = !nameQuery || rowName.indexOf(nameQuery) >= 0;
            var contactOk =
              !contactQuery || rowContact.indexOf(contactQuery) >= 0;
            return nameOk && contactOk;
          });
        }

        function sortRows(rows) {
          var copied = (rows || []).slice();
          copied.sort(function (a, b) {
            var aCheckin = asYmdNumber(a && a.checkIn);
            var bCheckin = asYmdNumber(b && b.checkIn);
            if (sortKey === "reservationDate") {
              var aRes = reservationDateNumber(a);
              var bRes = reservationDateNumber(b);
              if (aRes !== bRes) {
                return aRes - bRes;
              }
              return aCheckin - bCheckin;
            }
            if (sortKey === "pendingFirst" || sortKey === "confirmedFirst") {
              var wantPending = sortKey === "pendingFirst";
              var aIsPending = !(a && a.bankConfirmed);
              var bIsPending = !(b && b.bankConfirmed);
              var aPriority = aIsPending === wantPending ? 0 : 1;
              var bPriority = bIsPending === wantPending ? 0 : 1;
              if (aPriority !== bPriority) {
                return aPriority - bPriority;
              }
              if (aCheckin !== bCheckin) {
                return aCheckin - bCheckin;
              }
              return reservationDateNumber(a) - reservationDateNumber(b);
            }
            // default: check-in 오름차순
            if (aCheckin !== bCheckin) {
              return aCheckin - bCheckin;
            }
            return reservationDateNumber(a) - reservationDateNumber(b);
          });
          return copied;
        }

        function renderRows(rows) {
          if (!tableBody) {
            return;
          }
          tableBody.innerHTML = "";
          if (!rows || !rows.length) {
            var emptyTr = document.createElement("tr");
            var emptyTd = document.createElement("td");
            emptyTd.colSpan = 8;
            emptyTd.textContent = "무통장 예약 내역이 없습니다.";
            emptyTr.appendChild(emptyTd);
            tableBody.appendChild(emptyTr);
            return;
          }
          rows.forEach(function (row) {
            var tr = document.createElement("tr");
            var statusLabel = row.bankConfirmed ? "입금확인" : "입금대기";
            var statusClass = row.bankConfirmed
              ? "admin-status-confirmed"
              : "admin-status-pending";

            tr.innerHTML =
              "<td>" +
              (row.reservationNumber || "—") +
              "</td>" +
              "<td>" +
              (row.guestName || "—") +
              "</td>" +
              "<td>" +
              (row.contact || "—") +
              "</td>" +
              "<td>" +
              (row.roomType || "—") +
              "</td>" +
              "<td>" +
              (row.checkIn || "—") +
              " ~ " +
              (row.checkOut || "—") +
              "</td>" +
              "<td>" +
              formatKRW(getConsecutiveSaleTotal(row)) +
              "</td>" +
              '<td><span class="' +
              statusClass +
              '">' +
              statusLabel +
              "</span></td>" +
              "<td></td>";

            var tdAction = tr.lastElementChild;
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "admin-confirm-btn";
            btn.textContent = "확정하기";
            btn.disabled = !!row.bankConfirmed;
            btn.addEventListener("click", function () {
              confirmReservation(row.reservationNumber, btn);
            });
            tdAction.appendChild(btn);
            tableBody.appendChild(tr);
          });
        }

        function renderPagination(totalCount) {
          if (!paginationEl) {
            return;
          }
          paginationEl.innerHTML = "";
          var totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
          if (totalCount <= PAGE_SIZE) {
            return;
          }

          function makePageBtn(label, page, disabled, isActive) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "admin-page-btn" + (isActive ? " is-active" : "");
            btn.textContent = label;
            btn.disabled = !!disabled;
            btn.addEventListener("click", function () {
              if (btn.disabled) {
                return;
              }
              currentPage = page;
              applyListView();
            });
            paginationEl.appendChild(btn);
          }

          makePageBtn("이전", Math.max(1, currentPage - 1), currentPage <= 1);
          for (var i = 1; i <= totalPages; i += 1) {
            makePageBtn(String(i), i, false, i === currentPage);
          }
          makePageBtn(
            "다음",
            Math.min(totalPages, currentPage + 1),
            currentPage >= totalPages,
          );
        }

        function applyListView(resetPage) {
          if (resetPage) {
            currentPage = 1;
          }
          var sortedRows = sortRows(latestRows);
          var filteredRows = getFilteredRows(sortedRows);
          var totalPages = Math.max(
            1,
            Math.ceil(filteredRows.length / PAGE_SIZE),
          );
          if (currentPage > totalPages) {
            currentPage = totalPages;
          }
          var start = (currentPage - 1) * PAGE_SIZE;
          var pageRows = filteredRows.slice(start, start + PAGE_SIZE);
          renderRows(pageRows);
          renderPagination(filteredRows.length);
        }

        function setRefreshLoading(isLoading) {
          if (!refreshBtn) {
            return;
          }
          refreshBtn.disabled = !!isLoading;
          refreshBtn.textContent = isLoading ? "•••" : "Refresh";
        }

        function loadList() {
          var auth = getAuthPayload();
          setRefreshLoading(true);
          return fetch(adminApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "list",
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "목록 조회 실패");
              }
              loginForm.hidden = true;
              if (loginTitleEl) {
                loginTitleEl.hidden = true;
              }
              if (categoryNav) {
                categoryNav.hidden = false;
              }
              latestRows = result.data.rows || [];
              applyListView(true);
              renderStatusCalendar();
              setActiveCategory("bank");
              showMessage("");
            })
            .finally(function () {
              setRefreshLoading(false);
            });
        }

        function confirmReservation(reservationNumber, buttonEl) {
          if (!reservationNumber) {
            return;
          }
          buttonEl.disabled = true;
          var auth = getAuthPayload();
          fetch(adminApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "confirm",
              reservationNumber: reservationNumber,
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "확정 처리 실패");
              }
              return loadList();
            })
            .catch(function (err) {
              buttonEl.disabled = false;
              showMessage(
                (err && err.message) || "확정 처리 중 오류가 발생했습니다.",
              );
            });
        }

        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!idInput.value.trim() || !pwInput.value.trim()) {
            showMessage("ID와 PW를 모두 입력해주세요.");
            return;
          }
          loadList().catch(function (err) {
            tableSection.hidden = true;
            renderRows([]);
            showMessage((err && err.message) || "조회 중 오류가 발생했습니다.");
          });
        });

        if (sortSelect) {
          sortSelect.addEventListener("change", function () {
            sortKey = sortSelect.value || "checkin";
            if (tableSection.hidden) {
              return;
            }
            applyListView(true);
          });
        }

        if (refreshBtn) {
          refreshBtn.addEventListener("click", function () {
            if (tableSection.hidden) {
              return;
            }
            loadList().catch(function (err) {
              showMessage(
                (err && err.message) || "새로고침 중 오류가 발생했습니다.",
              );
            });
          });
        }

        if (searchForm) {
          searchForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (tableSection.hidden) {
              return;
            }
            applyListView(true);
          });
        }

        if (searchResetBtn) {
          searchResetBtn.addEventListener("click", function () {
            if (searchNameInput) {
              searchNameInput.value = "";
            }
            if (searchContactInput) {
              searchContactInput.value = "";
            }
            if (!tableSection.hidden) {
              applyListView(true);
            }
          });
        }

        if (calendarPrevBtn) {
          calendarPrevBtn.addEventListener("click", function () {
            calendarViewDate = new Date(
              calendarViewDate.getFullYear(),
              calendarViewDate.getMonth() - 1,
              1,
            );
            renderStatusCalendar();
          });
        }

        if (calendarNextBtn) {
          calendarNextBtn.addEventListener("click", function () {
            calendarViewDate = new Date(
              calendarViewDate.getFullYear(),
              calendarViewDate.getMonth() + 1,
              1,
            );
            renderStatusCalendar();
          });
        }

        categoryButtons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (loginForm && !loginForm.hidden) {
              return;
            }
            setActiveCategory(btn.getAttribute("data-admin-category"));
          });
        });
      });
    </script>
  </body>
</html>
