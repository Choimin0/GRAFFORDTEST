<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESERVATION - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="home-page">
    <nav class="site-nav top-right-nav">
      <a href="index.html" class="nav-logo" aria-label="홈으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <a href="index.html">HOME</a>
      <a href="ROOMS.html">ROOMS</a>
      <a href="STORY.html">STORY</a>
      <a href="FACILITIES.html">FACILITIES</a>
    </nav>

    <section class="hero-section fullpage-section" id="hero">
      <div class="hero-media" aria-hidden="true">
        <img src="images/reservation.jpeg" alt="" class="hero-slide is-active" />
        <div class="hero-overlay"></div>
      </div>
      <header class="site-header hero-header">
        <h1>RESERVATION</h1>
        <p>Simple and smooth booking</p>
      </header>
      <button class="scroll-down-btn" id="scroll-down-btn" aria-label="다음 섹션으로 이동">
        <span></span>
      </button>
    </section>

    <main class="content-section fullpage-section" id="content">
      <section class="features">
        <article class="feature scroll-fade">
          <img src="images/reservation.jpeg" alt="예약 방식 이미지" />
          <div class="feature-text">
            <h3>How to Reserve</h3>
            <p>전화와 이메일로 간편하게 예약할 수 있으며 문의 응답도 빠르게 진행됩니다.</p>
          </div>
        </article>
        <article class="feature scroll-fade">
          <img src="images/rooms.jpeg" alt="객실 선택 이미지" />
          <div class="feature-text">
            <h3>Choose Your Room</h3>
            <p>일정과 취향에 맞는 객실 타입을 선택하고 원하는 옵션을 함께 지정할 수 있습니다.</p>
          </div>
        </article>
        <article class="feature scroll-fade">
          <img src="images/story.jpeg" alt="예약 확인 이미지" />
          <div class="feature-text">
            <h3>Confirmation</h3>
            <p>예약 완료 후 확인 메시지를 전달드리며 체크인 전 필요한 안내를 미리 제공합니다.</p>
          </div>
        </article>
      </section>
      <footer class="site-footer">© 2026 GRAFFORD. all rights reserved.</footer>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const fadeTargets = document.querySelectorAll(".scroll-fade");
        const scrollButton = document.getElementById("scroll-down-btn");
        const nextSection = document.getElementById("content");

        const observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.2 },
        );

        fadeTargets.forEach(function (el) {
          observer.observe(el);
        });

        if (scrollButton && nextSection) {
          scrollButton.addEventListener("click", function () {
            nextSection.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
      });
    </script>
  </body>
</html>
