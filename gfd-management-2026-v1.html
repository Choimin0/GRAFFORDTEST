<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/LOGO-transparent.png" type="image/png" />
    <title>관리자 페이지 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="content-section confirm-page admin-page">
      <a href="index.html" class="admin-top-logo" aria-label="메인으로 이동">
        <img src="images/LOGO-transparent.png" alt="GRAFFORD LOGO" />
      </a>
      <h1 class="confirm-title">관리자 페이지</h1>
      <nav
        id="admin-category-nav"
        class="admin-category-nav"
        aria-label="관리자 카테고리"
        hidden
      >
        <button
          type="button"
          class="admin-category-btn is-active"
          data-admin-category="status"
        >
          예약 현황
        </button>
        <button
          type="button"
          class="admin-category-btn"
          data-admin-category="bank"
        >
          예약 목록
        </button>
        <button
          type="button"
          class="admin-category-btn"
          data-admin-category="room-manage"
        >
          객실 관리
        </button>
        <button
          type="button"
          class="admin-category-btn"
          data-admin-category="sales"
        >
          매출 현황
        </button>
      </nav>
      <section
        class="confirm-section admin-login-section"
        aria-labelledby="admin-login-title"
      >
        <h2 class="confirm-section-title" id="admin-login-title">
          관리자 로그인
        </h2>
        <form
          id="admin-login-form"
          class="admin-login-form reserveinfo-form checkout-form"
          novalidate
        >
          <label class="confirm-label">
            ID
            <input
              id="admin-id"
              type="text"
              autocomplete="username"
              required
              placeholder="관리자 ID"
            />
          </label>
          <label class="confirm-label">
            PW
            <input
              id="admin-pw"
              type="password"
              autocomplete="current-password"
              required
              placeholder="관리자 비밀번호"
            />
          </label>
          <div class="confirm-actions admin-login-actions">
            <button type="submit" class="btn reserve-btn confirm-pay-submit">
              조회하기
            </button>
          </div>
        </form>
        <p class="confirm-back" id="admin-message" hidden></p>
      </section>

      <section
        class="confirm-section"
        id="admin-status-section"
        aria-labelledby="admin-status-title"
        hidden
      >
        <div class="admin-status-top-grid">
          <section
            class="admin-status-card"
            aria-labelledby="admin-today-checkin-title"
          >
            <div class="admin-status-card-head">
              <h3
                id="admin-today-checkin-title"
                class="admin-status-card-title"
              >
                체크인 리스트
              </h3>
              <div class="admin-inline-date-nav">
                <button
                  type="button"
                  id="admin-checkin-prev-date"
                  class="admin-page-btn"
                  aria-label="이전 날짜"
                >
                  <
                </button>
                <strong
                  id="admin-checkin-date-label"
                  class="admin-inline-date-label"
                ></strong>
                <button
                  type="button"
                  id="admin-checkin-next-date"
                  class="admin-page-btn"
                  aria-label="다음 날짜"
                >
                  >
                </button>
              </div>
            </div>
            <div id="admin-today-checkin-list" class="admin-status-list"></div>
          </section>
          <section
            class="admin-status-card"
            aria-labelledby="admin-room-status-title"
          >
            <div class="admin-status-card-head">
              <h3 id="admin-room-status-title" class="admin-status-card-title">
                객실 현황
              </h3>
              <div class="admin-inline-date-nav">
                <button
                  type="button"
                  id="admin-room-week-prev"
                  class="admin-page-btn"
                  aria-label="이전 주"
                >
                  &lt;
                </button>
                <strong
                  id="admin-room-week-label"
                  class="admin-inline-date-label"
                ></strong>
                <button
                  type="button"
                  id="admin-room-week-next"
                  class="admin-page-btn"
                  aria-label="다음 주"
                >
                  &gt;
                </button>
              </div>
            </div>
            <div id="admin-room-status-list" class="admin-status-list"></div>
          </section>
        </div>
        <div class="admin-table-head">
          <div class="admin-calendar-nav">
            <button
              type="button"
              id="admin-calendar-prev"
              class="admin-page-btn"
            >
              <
            </button>
            <strong id="admin-calendar-label" class="admin-calendar-label"
              >—</strong
            >
            <button
              type="button"
              id="admin-calendar-next"
              class="admin-page-btn"
            >
              >
            </button>
          </div>
        </div>
        <div class="admin-calendar-wrap">
          <div class="admin-calendar-weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span
            ><span>목</span><span>금</span><span>토</span>
          </div>
          <div id="admin-calendar-grid" class="admin-calendar-grid"></div>

          <section
            id="admin-calendar-detail"
            class="admin-calendar-detail"
            hidden
          >
            <h3
              id="admin-calendar-detail-title"
              class="admin-calendar-detail-title"
            ></h3>
            <div
              id="admin-calendar-detail-list"
              class="admin-calendar-detail-list"
            ></div>
          </section>
        </div>
      </section>

      <section
        class="confirm-section"
        id="admin-bank-section"
        aria-labelledby="admin-bank-title"
        hidden
      >
        <div
          class="admin-res-tabs"
          id="admin-res-tabs"
          aria-label="예약 목록 탭"
        >
          <button
            type="button"
            class="admin-res-tab-btn is-active"
            data-res-tab="current"
          >
            현재 예약
          </button>
          <button type="button" class="admin-res-tab-btn" data-res-tab="past">
            지난 예약
          </button>
          <button
            type="button"
            class="admin-res-tab-btn"
            data-res-tab="deleted"
          >
            취소된 예약
          </button>
        </div>
        <div class="admin-table-head">
          <label class="admin-sort-control" for="admin-sort-select">
            정렬 기준
            <select id="admin-sort-select">
              <option value="checkin">입실일</option>
              <option value="reservationDate">예약일</option>
            </select>
          </label>
        </div>

        <form
          id="admin-search-form"
          class="admin-search-row"
          autocomplete="off"
        >
          <label class="confirm-label">
            예약자명
            <input
              id="admin-search-name"
              type="text"
              placeholder="예약자명으로 검색"
            />
          </label>
          <label class="confirm-label">
            연락처
            <input
              id="admin-search-contact"
              type="text"
              placeholder="연락처로 검색"
            />
          </label>
          <button type="submit" class="btn reserve-btn admin-search-btn">
            검색
          </button>
          <button
            type="button"
            id="admin-search-reset"
            class="btn reserve-btn admin-page-reset-btn"
          >
            초기화
          </button>
        </form>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>예약번호</th>
                <th>예약자</th>
                <th>연락처</th>
                <th>객실</th>
                <th>체크인/체크아웃</th>
                <th>총 금액</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
        <div
          id="admin-pagination"
          class="admin-pagination"
          aria-label="목록 페이지"
        ></div>
      </section>

      <section
        class="confirm-section"
        id="admin-room-manage-section"
        aria-labelledby="admin-room-manage-title"
        hidden
      >
        <div
          class="admin-res-tabs"
          id="admin-room-manage-tabs"
          aria-label="객실 관리 탭"
        >
          <button
            type="button"
            class="admin-res-tab-btn is-active"
            data-room-manage-tab="rate"
          >
            객실료
          </button>
          <button
            type="button"
            class="admin-res-tab-btn"
            data-room-manage-tab="status"
          >
            객실 현황
          </button>
          <button
            type="button"
            class="admin-res-tab-btn"
            data-room-manage-tab="block"
          >
            예약 막기
          </button>
        </div>
        <div id="admin-room-manage-rate-panel" class="admin-sales-panel">
          <div class="admin-table-wrap">
            <table class="admin-table admin-room-manage-table">
              <thead>
                <tr>
                  <th>객실 이름</th>
                  <th>평일 기본 요금</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="admin-room-rate-body"></tbody>
            </table>
          </div>
          <div class="admin-table-wrap" style="margin-top:24px">
            <table class="admin-table admin-room-manage-table">
              <thead>
                <tr>
                  <th>요금 정책</th>
                  <th>금액</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="admin-room-charge-body"></tbody>
            </table>
          </div>
        </div>
        <div
          id="admin-room-manage-status-panel"
          class="admin-sales-panel"
          hidden
        >
          <div class="admin-table-wrap">
            <table class="admin-table admin-room-manage-table">
              <thead>
                <tr>
                  <th>객실 이름</th>
                  <th>객실 상태</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="admin-room-manage-body"></tbody>
            </table>
          </div>
        </div>
        <div id="admin-room-manage-block-panel" class="admin-sales-panel" hidden>
          <p class="admin-sales-pending">준비 중입니다.</p>
        </div>
      </section>

      <section
        class="confirm-section"
        id="admin-sales-section"
        aria-labelledby="admin-sales-title"
        hidden
      >
        <div
          class="admin-res-tabs"
          id="admin-sales-tabs"
          aria-label="매출 현황 탭"
        >
          <button
            type="button"
            class="admin-res-tab-btn is-active"
            data-sales-tab="monthly"
          >
            한달 통계
          </button>
          <button
            type="button"
            class="admin-res-tab-btn"
            data-sales-tab="annual"
          >
            연별 통계
          </button>
        </div>

        <div id="admin-sales-monthly" class="admin-sales-panel"></div>
        <div id="admin-sales-annual" class="admin-sales-panel" hidden>
          <p class="admin-sales-pending">연별 통계 준비 중입니다.</p>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var loginForm = document.getElementById("admin-login-form");
        var loginTitleEl = document.getElementById("admin-login-title");
        var idInput = document.getElementById("admin-id");
        var pwInput = document.getElementById("admin-pw");
        var msgEl = document.getElementById("admin-message");
        var categoryNav = document.getElementById("admin-category-nav");
        var categoryButtons = document.querySelectorAll(".admin-category-btn");
        var statusSection = document.getElementById("admin-status-section");
        var bankSection = document.getElementById("admin-bank-section");
        var roomManageSection = document.getElementById(
          "admin-room-manage-section",
        );
        var salesSection = document.getElementById("admin-sales-section");
        var salesMonthlyPanel = document.getElementById("admin-sales-monthly");
        var salesAnnualPanel = document.getElementById("admin-sales-annual");
        var salesTabsEl = document.getElementById("admin-sales-tabs");
        var salesTabBtns = salesTabsEl
          ? salesTabsEl.querySelectorAll(".admin-res-tab-btn")
          : [];
        var tableSection = bankSection;
        var tableBody = document.getElementById("admin-table-body");
        var roomManageBody = document.getElementById("admin-room-manage-body");
        var roomRateBody = document.getElementById("admin-room-rate-body");
        var roomChargeBody = document.getElementById("admin-room-charge-body");
        var sortSelect = document.getElementById("admin-sort-select");
        var resTabs = document.getElementById("admin-res-tabs");
        var resTabBtns = resTabs
          ? resTabs.querySelectorAll(".admin-res-tab-btn")
          : [];
        var searchForm = document.getElementById("admin-search-form");
        var searchNameInput = document.getElementById("admin-search-name");
        var searchContactInput = document.getElementById(
          "admin-search-contact",
        );
        var searchResetBtn = document.getElementById("admin-search-reset");
        var paginationEl = document.getElementById("admin-pagination");
        var calendarPrevBtn = document.getElementById("admin-calendar-prev");
        var calendarNextBtn = document.getElementById("admin-calendar-next");
        var calendarLabel = document.getElementById("admin-calendar-label");
        var calendarGrid = document.getElementById("admin-calendar-grid");
        var calendarDetail = document.getElementById("admin-calendar-detail");
        var calendarDetailTitle = document.getElementById(
          "admin-calendar-detail-title",
        );
        var calendarDetailList = document.getElementById(
          "admin-calendar-detail-list",
        );
        var todayCheckinListEl = document.getElementById(
          "admin-today-checkin-list",
        );
        var roomStatusListEl = document.getElementById(
          "admin-room-status-list",
        );
        var checkinPrevDateBtn = document.getElementById(
          "admin-checkin-prev-date",
        );
        var checkinNextDateBtn = document.getElementById(
          "admin-checkin-next-date",
        );
        var checkinDateLabelEl = document.getElementById(
          "admin-checkin-date-label",
        );
        var roomWeekPrevBtn = document.getElementById("admin-room-week-prev");
        var roomWeekNextBtn = document.getElementById("admin-room-week-next");
        var roomWeekLabelEl = document.getElementById("admin-room-week-label");
        var latestRows = [];
        var latestCalendarRows = [];
        var reservationListRows = [];
        var roomStatusManageRows = [];
        var roomRateRows = [];
        var roomChargeRows = [];
        var CHARGE_LABELS = {
          "weekend-charge":   { label: "주말 요금", unit: "원/박" },
          "consecutive-sale": { label: "연박 할인", unit: "원/박" },
          "promotion":        { label: "프로모션 할인", unit: "%" },
        };
        var roomStatusByRoom = { G1: "", G2: "", G3: "", G4: "" };
        var activeResTab = "current";
        var activeSalesTab = "monthly";
        var activeRoomManageTab = "rate";
        var currentPage = 1;
        var PAGE_SIZE = 20;
        var sortKey = "checkin";
        var activeCategory = "bank";
        var roomManageTabsEl = document.getElementById("admin-room-manage-tabs");
        var roomManageTabBtns = roomManageTabsEl
          ? roomManageTabsEl.querySelectorAll(".admin-res-tab-btn")
          : [];
        var roomManageRatePanel = document.getElementById(
          "admin-room-manage-rate-panel",
        );
        var roomManageStatusPanel = document.getElementById(
          "admin-room-manage-status-panel",
        );
        var roomManageBlockPanel = document.getElementById(
          "admin-room-manage-block-panel",
        );
        var calendarViewDate = new Date();
        calendarViewDate.setDate(1);
        var selectedCheckinDate = getTodayYmdKst();
        var roomStatusWeekStart = getTodayYmdKst();
        var query = new URLSearchParams(window.location.search || "");
        var isLocalhost =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";
        var isLayoutPreviewMode =
          isLocalhost && query.get("adminPreview") === "1";

        function setLoggedOutView() {
          if (categoryNav) {
            categoryNav.hidden = true;
          }
          statusSection.hidden = true;
          bankSection.hidden = true;
          roomManageSection.hidden = true;
          salesSection.hidden = true;
          loginForm.hidden = false;
          if (loginTitleEl) {
            loginTitleEl.hidden = false;
          }
        }

        function dateKey(ymd) {
          return String(ymd || "").slice(0, 10);
        }

        function addOneDay(ymd, deltaDays) {
          var p = String(ymd || "").split("-");
          var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          d.setDate(d.getDate() + Number(deltaDays == null ? 1 : deltaDays));
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }

        function expandNights(ci, co) {
          var out = [];
          var cur = dateKey(ci);
          var end = dateKey(co);
          while (cur && end && cur < end) {
            out.push(cur);
            cur = addOneDay(cur);
          }
          return out;
        }

        function getReservationCountByDate() {
          var counts = Object.create(null);
          (latestCalendarRows || []).forEach(function (row) {
            var ci = dateKey(row && row.checkIn);
            var co = dateKey(row && row.checkOut);
            expandNights(ci, co).forEach(function (d) {
              counts[d] = (counts[d] || 0) + 1;
            });
          });
          return counts;
        }

        function getPastReservationCountByDate() {
          var counts = Object.create(null);
          (latestCalendarRows || []).forEach(function (row) {
            if (!row || row.isPast !== true) {
              return;
            }
            var ci = dateKey(row.checkIn);
            var co = dateKey(row.checkOut);
            expandNights(ci, co).forEach(function (d) {
              counts[d] = (counts[d] || 0) + 1;
            });
          });
          return counts;
        }

        function formatDateLabel(ymd) {
          var p = String(ymd || "").split("-");
          if (p.length !== 3) {
            return String(ymd || "");
          }
          return p[0] + "." + p[1] + "." + p[2];
        }

        function getTodayYmdKst() {
          var parts = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Seoul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).formatToParts(new Date());
          var map = {};
          parts.forEach(function (p) {
            if (p.type !== "literal") {
              map[p.type] = p.value;
            }
          });
          return (
            String(map.year || "") +
            "-" +
            String(map.month || "01") +
            "-" +
            String(map.day || "01")
          );
        }

        function compareYmd(a, b) {
          if (a === b) return 0;
          return a < b ? -1 : 1;
        }

        function appendCheckinCell(tr, text, className) {
          var td = document.createElement("td");
          if (className) {
            td.className = className;
          }
          td.textContent = text == null ? "" : String(text);
          tr.appendChild(td);
          return td;
        }

        function formatGuestCount(row) {
          var raw = row && row.guestCount;
          if (raw == null || raw === "") {
            return "—";
          }
          return String(raw) + "명";
        }

        function setRoomStatusRows(rows) {
          var nextMap = { G1: "", G2: "", G3: "", G4: "" };
          (rows || []).forEach(function (row) {
            var room = String((row && row.roomName) || "")
              .trim()
              .toUpperCase();
            if (!nextMap.hasOwnProperty(room)) {
              return;
            }
            nextMap[room] = String((row && row.statusText) || "");
          });
          roomStatusByRoom = nextMap;
        }

        function getManageCellDisplay(text) {
          var full = String(text || "").trim();
          if (!full) {
            return { display: "—", tooltip: "" };
          }
          var MAX_LEN = 14;
          if (full.length <= MAX_LEN) {
            return { display: full, tooltip: "" };
          }
          return { display: full.slice(0, MAX_LEN) + "...", tooltip: full };
        }

        function renderTodayStatusPanels() {
          if (!todayCheckinListEl || !roomStatusListEl) {
            return;
          }
          var today = getTodayYmdKst();
          var selectedDate = selectedCheckinDate || today;
          if (checkinDateLabelEl) {
            checkinDateLabelEl.textContent = formatDateLabel(selectedDate);
          }
          var rows = (latestCalendarRows || []).filter(function (row) {
            return row && row.checkIn && row.checkOut;
          });

          var todayCheckins = rows.filter(function (row) {
            return dateKey(row.checkIn) === selectedDate;
          });
          todayCheckinListEl.innerHTML = "";
          var rooms = ["G1", "G2", "G3", "G4"];
          var tableWrap = document.createElement("div");
          tableWrap.className = "admin-checkin-table-wrap";
          var table = document.createElement("table");
          table.className = "admin-checkin-table";
          var thead = document.createElement("thead");
          var headTr = document.createElement("tr");
          ["", "예약자명", "인원수", "알림톡", "요청사항", "객실관리"].forEach(
            function (label, idx) {
              var th = document.createElement("th");
              th.scope = "col";
              th.textContent = label;
              if (idx === 0) {
                th.setAttribute("aria-label", "객실");
              }
              headTr.appendChild(th);
            },
          );
          thead.appendChild(headTr);
          table.appendChild(thead);

          var tbody = document.createElement("tbody");
          rooms.forEach(function (room) {
            var roomCheckin = todayCheckins
              .filter(function (row) {
                return String(row.roomType || "").toUpperCase() === room;
              })
              .sort(function (a, b) {
                return compareYmd(dateKey(a.checkOut), dateKey(b.checkOut));
              })[0];
            var tr = document.createElement("tr");
            var roomTh = document.createElement("th");
            roomTh.scope = "row";
            roomTh.textContent = room;
            tr.appendChild(roomTh);

            if (!roomCheckin) {
              appendCheckinCell(tr, "");
              appendCheckinCell(tr, "");
              appendCheckinCell(tr, "");
              appendCheckinCell(tr, "—", "admin-checkin-request-cell");
              appendCheckinCell(tr, "—", "admin-checkin-manage-cell");
              tbody.appendChild(tr);
              return;
            }

            appendCheckinCell(tr, roomCheckin.guestName || "—");
            appendCheckinCell(tr, formatGuestCount(roomCheckin));
            var talkTd = appendCheckinCell(tr, "");
            var sendBtn = document.createElement("button");
            sendBtn.type = "button";
            sendBtn.className = "admin-checkin-send-btn";
            sendBtn.textContent = "전송";
            sendBtn.dataset.room = room;
            sendBtn.dataset.reservationNumber =
              roomCheckin.reservationNumber || "";
            talkTd.appendChild(sendBtn);
            var requestText = roomCheckin.guestRequest || "—";
            var requestTd = appendCheckinCell(
              tr,
              requestText,
              "admin-checkin-request-cell",
            );
            requestTd.dataset.tooltip = requestText;
            var manageInfo = getManageCellDisplay(roomStatusByRoom[room] || "");
            var manageTd = appendCheckinCell(
              tr,
              manageInfo.display,
              "admin-checkin-manage-cell",
            );
            manageTd.dataset.tooltip = manageInfo.tooltip;
            tbody.appendChild(tr);
          });

        function drawDonutChart(containerEl, segments, emptyColor) {
          // segments: [{label, value, color}]
          var NS = "http://www.w3.org/2000/svg";
          var SIZE = 160; //원 자체의 크기
          var cx = SIZE / 2;
          var cy = SIZE / 2;
          var R = 55; //원 반지름
          var strokeW = 18; //링 두께
          var gap = 0.018; // 세그먼트 사이 간격

          var svg = document.createElementNS(NS, "svg");
          svg.setAttribute("viewBox", "0 0 " + SIZE + " " + SIZE);
          svg.setAttribute("aria-hidden", "true");

          var total = segments.reduce(function (s, d) {
            return s + (d.value || 0);
          }, 0);

          if (!total) {
            var emptyCircle = document.createElementNS(NS, "circle");
            emptyCircle.setAttribute("cx", cx);
            emptyCircle.setAttribute("cy", cy);
            emptyCircle.setAttribute("r", R);
            emptyCircle.setAttribute("fill", "none");
            emptyCircle.setAttribute(
              "stroke",
              emptyColor || "rgba(58,53,49,0.1)",
            );
            emptyCircle.setAttribute("stroke-width", strokeW);
            svg.appendChild(emptyCircle);
            containerEl.appendChild(svg);
            return;
          }

          var startAngle = -Math.PI / 2;
          segments.forEach(function (seg) {
            if (!seg.value) {
              return;
            }
            var fraction = seg.value / total;
            var sweep =
              fraction * 2 * Math.PI - (segments.length > 1 ? gap : 0);
            var endAngle = startAngle + sweep;

            var x1 = cx + R * Math.cos(startAngle);
            var y1 = cy + R * Math.sin(startAngle);
            var x2 = cx + R * Math.cos(endAngle);
            var y2 = cy + R * Math.sin(endAngle);
            var largeArc = sweep > Math.PI ? 1 : 0;

            var path = document.createElementNS(NS, "path");
            path.setAttribute(
              "d",
              "M " +
                x1 +
                " " +
                y1 +
                " A " +
                R +
                " " +
                R +
                " 0 " +
                largeArc +
                " 1 " +
                x2 +
                " " +
                y2,
            );
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", seg.color);
            path.setAttribute("stroke-width", strokeW);
            path.setAttribute("stroke-linecap", "round");
            svg.appendChild(path);

            startAngle += fraction * 2 * Math.PI;
          });

          containerEl.appendChild(svg);
        }

        function drawMonthlyOccupancyHeatmap(containerEl, occupancyByDay) {
          if (!containerEl) return;
          containerEl.innerHTML = "";

          var now = new Date();
          var year = now.getFullYear();
          var month = now.getMonth() + 1;
          if (occupancyByDay && occupancyByDay.length) {
            var first = String(occupancyByDay[0].date || "");
            var mm = first.match(/^(\d{4})-(\d{2})-/);
            if (mm) {
              year = Number(mm[1]) || year;
              month = Number(mm[2]) || month;
            }
          }

          var HEAT_COLORS = [
            "#e8e1d5", // 0
            "#d3c7b1", // 1
            "#b8aa94", // 2
            "#8e8172", // 3
            "#3a3531", // 4
          ];

          var maxCount = 0;
          var occupancyMap = {};
          (occupancyByDay || []).forEach(function (row) {
            var dateKey = String(row && row.date ? row.date : "");
            var c = Number(row && row.count) || 0;
            occupancyMap[dateKey] = c;
            if (c > maxCount) maxCount = c;
          });

          function levelByCount(c) {
            if (c <= 0 || maxCount <= 0) return 0;
            return Math.min(4, Math.ceil((c / maxCount) * 4));
          }

          function ymd(y, m, d) {
            return (
              String(y) +
              "-" +
              String(m).padStart(2, "0") +
              "-" +
              String(d).padStart(2, "0")
            );
          }

          var title = document.createElement("div");
          title.className = "admin-sales-heatmap-title";
          
          containerEl.appendChild(title);

          var weekHeader = document.createElement("div");
          weekHeader.className = "admin-sales-heatmap-weekhead";
          ["일", "월", "화", "수", "목", "금", "토"].forEach(function (w) {
            var el = document.createElement("span");
            el.textContent = w;
            weekHeader.appendChild(el);
          });
          containerEl.appendChild(weekHeader);

          var grid = document.createElement("div");
          grid.className = "admin-sales-heatmap-grid";

          var firstDow = new Date(year, month - 1, 1).getDay();
          var daysInMonth = new Date(year, month, 0).getDate();
          var totalCells = 42;

          for (var i = 0; i < totalCells; i++) {
            var cell = document.createElement("div");
            if (i < firstDow || i >= firstDow + daysInMonth) {
              cell.className = "admin-sales-heatmap-cell is-empty";
              grid.appendChild(cell);
              continue;
            }
            var dayNum = i - firstDow + 1;
            var key = ymd(year, month, dayNum);
            var count = Number(occupancyMap[key]) || 0;
            var level = levelByCount(count);
            cell.className = "admin-sales-heatmap-cell";
            cell.style.background = HEAT_COLORS[level];
            cell.title = key + " · 예약객실 " + count + "개";
            cell.textContent = String(dayNum);
            grid.appendChild(cell);
          }

          containerEl.appendChild(grid);
        }

        // ── 라인 차트 공통 렌더러 ──────────────────────────────────────────
        // opts: { xLabels, yValues, baseUnit, color, currentIdx }
        function drawLineChart(containerEl, opts) {
          var NS = "http://www.w3.org/2000/svg";
          var VW = 600,
            VH = 220;
          var mL = 60,
            mR = 18,
            mT = 18,
            mB = 40;
          var chartW = VW - mL - mR;
          var chartH = VH - mT - mB;

          var xLabels = opts.xLabels || [];
          var yValues = opts.yValues || [];
          var n = xLabels.length;
          var color = opts.color || "#3a3531";
          var baseUnit = opts.baseUnit || 100000;

          // Y축 최대값 및 눈금 계산
          var maxVal = Math.max.apply(null, yValues.concat([0]));
          var rawMax = Math.ceil(maxVal / baseUnit) * baseUnit || baseUnit * 5;
          var targetTicks = 5;
          var rawStep = rawMax / targetTicks;
          var step = Math.max(
            baseUnit,
            Math.ceil(rawStep / baseUnit) * baseUnit,
          );
          var yMax = Math.ceil(rawMax / step) * step;

          var yTicks = [];
          for (var v = 0; v <= yMax + 0.001; v += step) {
            yTicks.push(Math.round(v));
          }

          function xPos(i) {
            if (n <= 1) return mL + chartW / 2;
            return mL + (i / (n - 1)) * chartW;
          }
          function yPos(val) {
            return mT + chartH - (val / yMax) * chartH;
          }
          function fmtY(v) {
            if (v === 0) return "0";
            return v / 10000 + "만";
          }

          var svg = document.createElementNS(NS, "svg");
          svg.setAttribute("viewBox", "0 0 " + VW + " " + VH);
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
          svg.style.width = "100%";
          svg.style.height = "auto";
          svg.style.display = "block";

          // 수평 격자선 + Y 레이블
          yTicks.forEach(function (yv) {
            var y = yPos(yv);
            var gridLine = document.createElementNS(NS, "line");
            gridLine.setAttribute("x1", mL);
            gridLine.setAttribute("y1", y);
            gridLine.setAttribute("x2", mL + chartW);
            gridLine.setAttribute("y2", y);
            gridLine.setAttribute(
              "stroke",
              yv === 0 ? "rgba(58,53,49,0.22)" : "rgba(58,53,49,0.09)",
            );
            gridLine.setAttribute("stroke-width", "0.7"); //점을 잇는 연결선 굵기
            svg.appendChild(gridLine);

            var yText = document.createElementNS(NS, "text");
            yText.setAttribute("x", mL - 7);
            yText.setAttribute("y", y);
            yText.setAttribute("text-anchor", "end");
            yText.setAttribute("dominant-baseline", "middle");
            yText.setAttribute("font-size", "7");
            yText.setAttribute("fill", "rgba(58,53,49,0.45)");
            yText.textContent = fmtY(yv);
            svg.appendChild(yText);
          });

          // X축 레이블
          xLabels.forEach(function (lbl, i) {
            var xText = document.createElementNS(NS, "text");
            xText.setAttribute("x", xPos(i));
            xText.setAttribute("y", VH - mB + 16);
            xText.setAttribute("text-anchor", "middle");
            xText.setAttribute("font-size", "7");
            xText.setAttribute("fill", "rgba(58,53,49,0.5)");
            xText.textContent = lbl;
            svg.appendChild(xText);
          });

          // 연결선 디자인
          if (yValues.length > 1) {
            var pathD = "";
            yValues.forEach(function (v, i) {
              pathD +=
                (i === 0 ? "M" : "L") + " " + xPos(i) + " " + yPos(v) + " ";
            });
            var linePath = document.createElementNS(NS, "path");
            linePath.setAttribute("d", pathD.trim());
            linePath.setAttribute("fill", "none");
            linePath.setAttribute("stroke", color);
            linePath.setAttribute("stroke-width", "1.5");
            linePath.setAttribute("stroke-linejoin", "round");
            linePath.setAttribute("stroke-linecap", "round");
            svg.appendChild(linePath);
          }

          // 데이터 점 디자인
          yValues.forEach(function (v, i) {
            var isCurrent = opts.currentIdx === i;
            var dot = document.createElementNS(NS, "circle");
            dot.setAttribute("cx", xPos(i));
            dot.setAttribute("cy", yPos(v));
            dot.setAttribute("r", "3.5");
            dot.setAttribute("fill", color);
            dot.setAttribute("stroke", "none");
            dot.setAttribute("stroke-width", "0");
            svg.appendChild(dot);
          });

          containerEl.appendChild(svg);
        }

        function formatKRW(n) {

        function formatPaymentMethodLabel(method) {
          var raw = String(method || "")
            .trim()
            .toLowerCase();
          if (raw === "card" || raw === "신용카드") {
            return "신용카드";
          }
          if (raw === "naver" || raw === "네이버페이") {

          }
          if (raw === "bank" || raw === "무통장입금") {
            return "무통장입금";
          }
          return "결제수단 미확인";
        }

        function parseDateValue(value) {
          var raw = String(value || "").trim();
          if (!raw) {
            return null;
          }
          var normalized = raw.replace(/\./g, "-").replace(/\//g, "-");
          var date = new Date(normalized);
          if (isNaN(date.getTime())) {
            return null;
          }
          return date;
        }

        function getStayPeriodNights(row) {
          var direct = Number(
            (row && (row.stayPeriod || row.stay_period)) || 0,
          );
          if (isFinite(direct) && direct > 0) {
            return Math.floor(direct);
          }
          var checkInDate = parseDateValue(row && row.checkIn);
          var checkOutDate = parseDateValue(row && row.checkOut);
          if (!checkInDate || !checkOutDate) {
            return 0;
          }
          var diffMs = checkOutDate.getTime() - checkInDate.getTime();
          var nights = Math.floor(diffMs / (24 * 60 * 60 * 1000));
          return nights > 0 ? nights : 0;
        }

        function getConsecutiveSaleTotal(row) {
          var baseTotal = Number((row && row.totalAmount) || 0);
          var nights = getStayPeriodNights(row);
          if (nights < 2) {
            return baseTotal;
          }
          var discount = (nights - 1) * 20000;
          return Math.max(0, baseTotal - discount);
        }

        function getAuthPayload() {
          return {
            adminId: String(idInput.value || "").trim(),
            adminPw: String(pwInput.value || "").trim(),

        function asYmdNumber(ymd) {
          var safe = String(ymd || "").replace(/\D/g, "");
          if (!safe) {
            return Number.MAX_SAFE_INTEGER;
          }
          return Number(safe);
        }

        function reservationDateNumber(row) {
          var raw = String((row && row.reservationNumber) || "").slice(0, 8);
          if (!/^\d{8}$/.test(raw)) {
            return Number.MAX_SAFE_INTEGER;
          }
          return Number(raw);
        }

        function normalizeSearchValue(v) {
          return String(v || "")
            .trim()
            .toLowerCase();
        }

        function getFilteredRows(rows) {
          var nameQuery = normalizeSearchValue(
            searchNameInput && searchNameInput.value,
          );
          var contactQuery = normalizeSearchValue(
            searchContactInput && searchContactInput.value,
          ).replace(/\s+/g, "");
          if (!nameQuery && !contactQuery) {
            return (rows || []).slice();
          }
          return (rows || []).filter(function (row) {
            var rowName = normalizeSearchValue(row && row.guestName);
            var rowContact = normalizeSearchValue(row && row.contact).replace(
              /\s+/g,
              "",
            );
            var nameOk = !nameQuery || rowName.indexOf(nameQuery) >= 0;
            var contactOk =
              !contactQuery || rowContact.indexOf(contactQuery) >= 0;
            return nameOk && contactOk;
          });
        }

        function sortRows(rows) {
          var copied = (rows || []).slice();
          copied.sort(function (a, b) {
            var aCheckin = asYmdNumber(a && a.checkIn);
            var bCheckin = asYmdNumber(b && b.checkIn);
            if (sortKey === "reservationDate") {
              var aRes = reservationDateNumber(a);
              var bRes = reservationDateNumber(b);
              if (aRes !== bRes) {
                return aRes - bRes;
              }
              return aCheckin - bCheckin;
            }
            // default: check-in 오름차순
            if (aCheckin !== bCheckin) {
              return aCheckin - bCheckin;
            }
            return reservationDateNumber(a) - reservationDateNumber(b);
          });
          return copied;
        }

        function renderPagination(totalCount) {
          if (!paginationEl) {
            return;
          }
          paginationEl.innerHTML = "";
          var totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
          if (totalCount <= PAGE_SIZE) {
            return;
          }

          function makePageBtn(label, page, disabled, isActive) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "admin-page-btn" + (isActive ? " is-active" : "");
            btn.textContent = label;
            btn.disabled = !!disabled;
            btn.addEventListener("click", function () {
              if (btn.disabled) {
                return;
              }
              currentPage = page;
              applyListView();
            });
            paginationEl.appendChild(btn);
          }

          makePageBtn("이전", Math.max(1, currentPage - 1), currentPage <= 1);
          for (var i = 1; i <= totalPages; i += 1) {
            makePageBtn(String(i), i, false, i === currentPage);
          }
          makePageBtn(
            "다음",
            Math.min(totalPages, currentPage + 1),
            currentPage >= totalPages,
          );
        }

        function applyListView(resetPage) {
          if (resetPage) {
            currentPage = 1;
          }
          var sortedRows = sortRows(reservationListRows);
          var filteredRows = getFilteredRows(sortedRows);
          var totalPages = Math.max(
            1,
            Math.ceil(filteredRows.length / PAGE_SIZE),
          );
          if (currentPage > totalPages) {
            currentPage = totalPages;
          }
          var start = (currentPage - 1) * PAGE_SIZE;
          var pageRows = filteredRows.slice(start, start + PAGE_SIZE);
          renderRows(pageRows);
          renderPagination(filteredRows.length);
        }

              }
              if (roomName === "promotion" && val > 100) {
                showMessage("프로모션 할인율은 0~100% 사이로 입력해 주세요.");
                return;
              }
              btn.disabled = true;
              saveRoomRateRow(roomName, val)
                .catch(function (err) {
                  showMessage((err && err.message) || "저장 실패");
                })
                .finally(function () {
                  btn.disabled = false;
                });
            });
          });
        }

        function renderRoomRateTable() {
          if (!roomRateBody) return;
          roomRateBody.innerHTML = "";
          if (!roomRateRows.length) {
            var emptyTr = document.createElement("tr");
            var emptyTd = document.createElement("td");
            emptyTd.colSpan = 3;
            emptyTd.textContent = "객실 요금 데이터가 없습니다.";
            emptyTr.appendChild(emptyTd);
            roomRateBody.appendChild(emptyTr);
          } else {
            roomRateRows.forEach(function (row) {
              var tr = document.createElement("tr");
              tr.innerHTML =
                "<td class='admin-room-name-cell'>" + escapeHtml(row.roomName || "—") + "</td>" +
                "<td><input class='admin-room-status-input admin-room-rate-input' data-room-name='" +
                escapeHtml(row.roomName || "") + "' type='number' min='0' step='1000' value='" +
                String(Number(row.weekdayBaseRate || 0)) + "' /></td>" +
                "<td><button type='button' class='admin-confirm-btn admin-room-rate-save-btn' data-room-name='" +
                escapeHtml(row.roomName || "") + "'>저장</button></td>";
              roomRateBody.appendChild(tr);
            });
            attachRateSaveBtns(roomRateBody);
          }

          if (!roomChargeBody) return;
          roomChargeBody.innerHTML = "";
          if (!roomChargeRows.length) {
            var cEmptyTr = document.createElement("tr");
            var cEmptyTd = document.createElement("td");
            cEmptyTd.colSpan = 3;
            cEmptyTd.textContent = "요금 정책 데이터가 없습니다.";
            cEmptyTr.appendChild(cEmptyTd);
            roomChargeBody.appendChild(cEmptyTr);
          } else {
            roomChargeRows.forEach(function (row) {
              var meta = CHARGE_LABELS[row.roomName] || { label: row.roomName, unit: "원" };
              var step = row.roomName === "promotion" ? "1" : "1000";
              var maxAttr = row.roomName === "promotion" ? " max='100'" : "";
              var tr = document.createElement("tr");
              tr.innerHTML =
                "<td class='admin-room-name-cell'>" + escapeHtml(meta.label) +
                " <span style='color:#888;font-size:0.82em'>(" + escapeHtml(meta.unit) + ")</span></td>" +
                "<td><input class='admin-room-status-input admin-room-rate-input' data-room-name='" +
                escapeHtml(row.roomName) + "' type='number' min='0' step='" + step + "'" + maxAttr +
                " value='" + String(Number(row.weekdayBaseRate || 0)) + "' /></td>" +
                "<td><button type='button' class='admin-confirm-btn admin-room-rate-save-btn' data-room-name='" +
                escapeHtml(row.roomName) + "'>저장</button></td>";
              roomChargeBody.appendChild(tr);
            });
            attachRateSaveBtns(roomChargeBody);
          }
        }

        function loadRoomStatusManageRows() {
          return loadRoomStatusRows().then(function (rows) {
            roomStatusManageRows = rows || [];
            renderRoomManageTable();
            showMessage("");
          });
        }

        function loadRoomStatusRows() {
          var auth = getAuthPayload();
          return fetch(adminRoomStatusApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "list",
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "객실 상태 조회 실패");
              }
              var rows = result.data.rows || [];
              setRoomStatusRows(rows);
              return rows;
            });
        }

        var CHARGE_NAME_SET = ["weekend-charge", "consecutive-sale", "promotion"];

        function splitRateRows(rows) {
          roomRateRows = [];
          roomChargeRows = [];
          (rows || []).forEach(function (row) {
            if (CHARGE_NAME_SET.includes(row.roomName)) {
              roomChargeRows.push(row);
            } else {
              roomRateRows.push(row);
            }
          });
        }

        function loadRoomRateRows() {
          var auth = getAuthPayload();
          return fetch(adminRoomRateApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "list",
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "객실 요금 조회 실패");
              }
              splitRateRows(result.data.rows || []);
              renderRoomRateTable();
              showMessage("");
            });
        }

        function saveRoomRateRow(roomName, weekdayBaseRate) {
          var auth = getAuthPayload();
          return fetch(adminRoomRateApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "save",
              roomName: roomName,
              weekdayBaseRate: Math.floor(weekdayBaseRate),
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "저장 실패");
              }
              splitRateRows(result.data.rows || []);
              renderRoomRateTable();
              showMessage("저장되었습니다.");
            });
        }

        function setActiveRoomManageTab(tab) {
          activeRoomManageTab = tab || "rate";
          roomManageTabBtns.forEach(function (btn) {
            btn.classList.toggle(
              "is-active",
              btn.getAttribute("data-room-manage-tab") === activeRoomManageTab,
            );
          });
          if (roomManageRatePanel) {
            roomManageRatePanel.hidden = activeRoomManageTab !== "rate";
          }
          if (roomManageStatusPanel) {
            roomManageStatusPanel.hidden = activeRoomManageTab !== "status";
          }
          if (roomManageBlockPanel) {
            roomManageBlockPanel.hidden = activeRoomManageTab !== "block";
          }

          if (activeRoomManageTab === "rate" && !isLayoutPreviewMode) {
            loadRoomRateRows().catch(function (err) {
              showMessage(
                (err && err.message) || "객실 요금 조회 중 오류가 발생했습니다.",
              );
            });
          }
          if (activeRoomManageTab === "status" && !isLayoutPreviewMode) {
            loadRoomStatusManageRows().catch(function (err) {
              showMessage(
                (err && err.message) ||
                  "객실 상태 조회 중 오류가 발생했습니다.",
              );
            });
          }
        }

        function saveRoomStatusManageRow(roomName, statusText) {
          var auth = getAuthPayload();
          return fetch(adminRoomStatusApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "save",
              roomName: roomName,
              statusText: statusText,
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "객실 상태 저장 실패");
              }
              roomStatusManageRows = result.data.rows || [];
              setRoomStatusRows(roomStatusManageRows);
              renderRoomManageTable();
              if (!statusSection.hidden) {
                renderTodayStatusPanels();
              }
            });
        }

        function setActiveResTab(tab) {
          activeResTab = tab;
          resTabBtns.forEach(function (btn) {
            btn.classList.toggle(
              "is-active",
              btn.getAttribute("data-res-tab") === tab,
            );
          });
          loadReservationList(tab).catch(function (err) {
            showMessage(
              (err && err.message) || "목록 조회 중 오류가 발생했습니다.",
            );
          });
        }

        function loadReservationList(tab) {
          var auth = getAuthPayload();
          var collectionMap = {
            current: "reservations",
            past: "past-reservations",
            deleted: "delete-reservations",
          };
          var collection = collectionMap[tab] || "reservations";
          return fetch(adminReservationsApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "list",
              collection: collection,
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "목록 조회 실패");
              }
              reservationListRows = result.data.rows || [];
              if (result.data.calendarRows) {
                latestCalendarRows = result.data.calendarRows;
                latestRows = latestCalendarRows;
              }
              applyListView(true);
              showMessage("");
            });
        }

        function loadList() {
          var auth = getAuthPayload();
          return fetch(adminApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "list",
              adminId: auth.adminId,
              adminPw: auth.adminPw,
            }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                return { ok: r.ok, data: data || {} };
              });
            })
            .then(function (result) {
              if (!result.ok || !result.data.ok) {
                throw new Error(result.data.error || "목록 조회 실패");
              }
              loginForm.hidden = true;
              if (loginTitleEl) {
                loginTitleEl.hidden = true;
              }
              if (categoryNav) {
                categoryNav.hidden = false;
              }
              latestRows = result.data.rows || [];
              latestCalendarRows = result.data.calendarRows || latestRows || [];
              return loadRoomStatusRows()
                .catch(function () {
                  setRoomStatusRows([]);
                })
                .then(function () {
                  renderStatusCalendar();
                  renderTodayStatusPanels();
                  setActiveCategory("status");
                  showMessage("");
                });
            });
        }

        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!idInput.value.trim() || !pwInput.value.trim()) {
            showMessage("ID와 PW를 모두 입력해주세요.");
            return;
          }
          loadList().catch(function (err) {
            tableSection.hidden = true;
            renderRows([]);
            showMessage((err && err.message) || "조회 중 오류가 발생했습니다.");
          });
        });

        if (sortSelect) {
          sortSelect.addEventListener("change", function () {
            sortKey = sortSelect.value || "checkin";
            if (tableSection.hidden) {
              return;
            }
            applyListView(true);
          });
        }

        resTabBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (bankSection.hidden) {
              return;
            }
            setActiveResTab(btn.getAttribute("data-res-tab"));
          });
        });

        salesTabBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (salesSection.hidden) {
              return;
            }
            setActiveSalesTab(btn.getAttribute("data-sales-tab"));
          });
        });

        roomManageTabBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (roomManageSection.hidden) {
              return;
            }
            setActiveRoomManageTab(btn.getAttribute("data-room-manage-tab"));
          });
        });

        if (searchForm) {
          searchForm.addEventListener("submit", function (e) {
            e.preventDefault();
            if (tableSection.hidden) {
              return;
            }
            applyListView(true);
          });
        }

        if (searchResetBtn) {
          searchResetBtn.addEventListener("click", function () {
            if (searchNameInput) {
              searchNameInput.value = "";
            }
            if (searchContactInput) {
              searchContactInput.value = "";
            }
            if (!tableSection.hidden) {
              applyListView(true);
            }
          });
        }

        if (calendarPrevBtn) {
          calendarPrevBtn.addEventListener("click", function () {
            calendarViewDate = new Date(
              calendarViewDate.getFullYear(),
              calendarViewDate.getMonth() - 1,
              1,
            );
            renderStatusCalendar();
          });
        }

        if (calendarNextBtn) {
          calendarNextBtn.addEventListener("click", function () {
            calendarViewDate = new Date(
              calendarViewDate.getFullYear(),
              calendarViewDate.getMonth() + 1,
              1,
            );
            renderStatusCalendar();
          });
        }

        if (checkinPrevDateBtn) {
          checkinPrevDateBtn.addEventListener("click", function () {
            selectedCheckinDate = addOneDay(
              selectedCheckinDate || getTodayYmdKst(),
              -1,
            );
            renderTodayStatusPanels();
          });
        }

        if (checkinNextDateBtn) {
          checkinNextDateBtn.addEventListener("click", function () {
            selectedCheckinDate = addOneDay(
              selectedCheckinDate || getTodayYmdKst(),
              1,
            );
            renderTodayStatusPanels();
          });
        }

        if (roomWeekPrevBtn) {
          roomWeekPrevBtn.addEventListener("click", function () {
            roomStatusWeekStart = addOneDay(
              roomStatusWeekStart || getTodayYmdKst(),
              -7,
            );
            renderRoomStatusTable();
          });
        }

        if (roomWeekNextBtn) {
          roomWeekNextBtn.addEventListener("click", function () {
            roomStatusWeekStart = addOneDay(
              roomStatusWeekStart || getTodayYmdKst(),
              7,
            );
            renderRoomStatusTable();
          });
        }

        categoryButtons.forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (loginForm && !loginForm.hidden) {
              return;
            }
            setActiveCategory(btn.getAttribute("data-admin-category"));
          });
        });

        if (isLayoutPreviewMode) {
          enableLayoutPreviewMode();
        } else {
          setLoggedOutView();
        }
      });
    </script>
  </body>
</html>
