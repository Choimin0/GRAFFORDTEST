<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/LOGO-transparent.png" type="image/png" />
    <title>결제 진행 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/mobile-nav.js" defer></script>
  </head>
  <body>
    <div id="grafford-react-fade-root"></div>
    <nav class="site-nav top-right-nav">
      <a href="index.html" class="nav-logo" aria-label="홈으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <button
        type="button"
        class="mobile-menu-btn"
        aria-label="메뉴 열기"
        aria-controls="mobile-nav-drawer"
        aria-expanded="false"
      >
        MENU
      </button>
      <div class="mobile-nav-backdrop" hidden></div>
      <aside
        id="mobile-nav-drawer"
        class="mobile-nav-drawer"
        aria-hidden="true"
      >
        <a href="STORY.html">STORY</a>
        <a href="GROUND.html">GROUND</a>
        <a href="FACILITIES.html">FACILITIES</a>
        <a href="RESERVATION.html">RESERVATION</a>
      </aside>
      <div class="desktop-nav-links" aria-label="데스크톱 메뉴">
        <a href="STORY.html">STORY</a>
        <a href="GROUND.html">GROUND</a>
        <a href="FACILITIES.html">FACILITIES</a>
        <a href="RESERVATION.html">RESERVATION</a>
      </div>
    </nav>

    <main class="content-section confirm-page payment-page">
      <h1 class="confirm-title">결제 진행</h1>
      <p class="confirm-summary">
        실제 결제 모듈을 연결하기 전 단계의 데모 페이지입니다.
      </p>
      <div class="confirm-total-box payment-summary-box" id="payment-summary" hidden>
        <p class="confirm-total-line" id="payment-order-line"></p>
        <p class="confirm-total-line" id="payment-amount-line"></p>
      </div>
      <p class="confirm-back">
        <a href="RESERVATION.html">예약으로</a>
        ·
        <a href="GROUND.html">객실 안내</a>
      </p>
      <footer
        id="site-business-footer-mount"
        class="site-footer site-business-footer"
        hidden
      ></footer>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var saved = null;
        try {
          saved = JSON.parse(sessionStorage.getItem("graffordPaymentData") || "null");
        } catch (e) {
          saved = null;
        }
        var orderNo = (saved && saved.orderNo) || "";
        var total = (saved && saved.totalAmount) || "";
        var box = document.getElementById("payment-summary");
        if (!orderNo && !total) {
          return;
        }
        box.hidden = false;
        if (orderNo) {
          document.getElementById("payment-order-line").textContent =
            "예약번호(서버 저장): " + orderNo;
        }
        if (total) {
          document.getElementById("payment-amount-line").textContent =
            "결제 금액: " +
            Number(total).toLocaleString("ko-KR") +
            "원";
        }
      });
    </script>
    <script defer src="js/grafford-page-fade.js"></script>
    <script src="js/site-business-footer.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        window.initSiteBusinessFooter({
          instagram: {
            href: "https://www.instagram.com/p/DWaqvQKkzye/",
            imgSrc: "images/insta.png",
          },
          lines: [
            "대표 : GRAFFORD",
            "주소 : 제주특별자치도 서귀포시 토산중앙로 22",
            "사업자등록번호 : 123-45-67890",
            "전화 : 010-1234-5678",
            "이메일 : info@grafford.com",
            " ",
            "© 2026 GRAFFORD. all rights reserved.",
          ],
        });
      });
    </script>
  </body>
</html>
