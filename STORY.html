<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STORY - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="home-page">
    <nav class="site-nav top-right-nav">
      <a href="index.html" class="nav-logo" aria-label="홈으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <a href="index.html">HOME</a>
      <a href="ROOMS.html">ROOMS</a>
      <a href="FACILITIES.html">FACILITIES</a>
      <a href="RESERVATION.html">RESERVATION</a>
    </nav>

    <section class="hero-section fullpage-section" id="hero">
      <div class="hero-media" aria-hidden="true">
        <img src="images/story.jpeg" alt="" class="hero-slide is-active" />
        <div class="hero-overlay"></div>
      </div>
      <header class="site-header hero-header">
        <h1>STORY</h1>
        <p>How we started</p>
      </header>
      <button
        class="scroll-down-btn"
        id="scroll-down-btn"
        aria-label="다음 섹션으로 이동"
      >
        <span></span>
      </button>
    </section>

    <main class="content-section fullpage-section" id="content">
      <section class="features">
        <article class="feature scroll-fade">
          <img src="images/story.jpeg" alt="GRAFFORD 시작 이야기" />
          <div class="feature-text">
            <h3>Beginning</h3>
            <p>
              GRAFFORD의 시작은 조용한 휴식 공간을 만들고 싶다는 작은 생각에서
              출발했습니다.
            </p>
          </div>
        </article>
        <article class="feature scroll-fade">
          <img src="images/rooms.jpeg" alt="객실 공간 이야기" />
          <div class="feature-text">
            <h3>Designing Spaces</h3>
            <p>
              머무는 모든 순간이 편안하도록 객실 동선과 분위기를 세심하게
              구성했습니다.
            </p>
          </div>
        </article>
        <article class="feature scroll-fade">
          <img src="images/reservation.jpeg" alt="운영과 서비스 이야기" />
          <div class="feature-text">
            <h3>Hospitality</h3>
            <p>
              예약부터 체크아웃까지, 방문자 한 분 한 분의 경험이 자연스럽고
              따뜻하게 이어지도록 운영합니다.
            </p>
          </div>
        </article>
      </section>
      <footer class="site-footer">© 2026 GRAFFORD. all rights reserved.</footer>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const fadeTargets = document.querySelectorAll(".scroll-fade");
        const scrollButton = document.getElementById("scroll-down-btn");
        const nextSection = document.getElementById("content");

        const observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.2 },
        );

        fadeTargets.forEach(function (el) {
          observer.observe(el);
        });

        if (scrollButton && nextSection) {
          scrollButton.addEventListener("click", function () {
            nextSection.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
      });
    </script>
  </body>
</html>
