<!doctype html>

    <title>예약 취소 완료 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/mobile-nav.js" defer></script>
  </head>
  <body>
    <div id="grafford-react-fade-root"></div>
    <nav class="site-nav top-right-nav">
      <a href="index.html" class="nav-logo" aria-label="홈으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <button
        type="button"
        class="mobile-menu-btn"
        aria-label="메뉴 열기"
        aria-controls="mobile-nav-drawer"
        aria-expanded="false"
      >
        MENU
      </button>
      <div class="mobile-nav-backdrop" hidden></div>
      <aside
        id="mobile-nav-drawer"
        class="mobile-nav-drawer"
        aria-hidden="true"
      >
        <a href="STORY.html">STORY</a>
        <a href="GROUND.html">GROUND</a>
        <a href="FACILITIES.html">FACILITIES</a>
        <a href="RESERVATION.html">RESERVATION</a>
      </aside>
      <div class="desktop-nav-links" aria-label="데스크톱 메뉴">
        <a href="STORY.html">STORY</a>
        <a href="GROUND.html">GROUND</a>
        <a href="FACILITIES.html">FACILITIES</a>
        <a href="RESERVATION.html">RESERVATION</a>
      </div>
    </nav>

    <main class="content-section confirm-page delete-complete-page">
      <div class="delete-complete-mark" aria-hidden="true">
        <img src="images/icons/confirm.png" alt="" />
      </div>
      <h1 class="confirm-title delete-complete-title">
        예약 취소가 정상적으로 완료되었습니다.
      </h1>
      <p class="confirm-summary delete-complete-subtitle">
        기다려주신 마음을 잘 알기에 아쉬움이 큽니다.
      </p>

      <section class="confirm-section delete-complete-info">
        <h2 class="confirm-section-title">예약 취소 정보</h2>
        <dl class="reserve-delete-dl">
          <dt>예약번호</dt>
          <dd id="done-order">—</dd>
          <dt>객실</dt>
          <dd id="done-room">—</dd>
          <dt>체크인/체크아웃</dt>
          <dd id="done-schedule">—</dd>
          <dt>예약자 성함</dt>
          <dd id="done-name">—</dd>
          <dt>예약자 연락처</dt>
          <dd id="done-contact">—</dd>
          <dt>결제 금액</dt>
          <dd id="done-amount">—</dd>
        </dl>
      </section>

      <div class="confirm-actions delete-complete-actions">
        <a href="index.html" class="reserve-complete-action-link">메인으로</a>
      </div>
      <div
        class="reserve-delete-modal-backdrop"
        id="delete-complete-back-modal"
        hidden
      >
        <div
          class="reserve-delete-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="delete-complete-back-modal-title"
        >
          <p
            id="delete-complete-back-modal-title"
            class="reserve-delete-modal-title"
          >
            이미 예약 취소가 완료되었습니다.
          </p>
          <div class="reserve-delete-modal-actions">
            <button
              type="button"
              class="btn reserve-btn"
              id="delete-complete-back-modal-ok"
            >
              확인
            </button>
          </div>
        </div>
      </div>

      <footer
        id="site-business-footer-mount"
        class="site-footer site-business-footer"
        hidden
      ></footer>
    </main>

    <script src="js/booking-pricing.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function blockBackNavigation() {
          var modal = document.getElementById("delete-complete-back-modal");
          var okBtn = document.getElementById("delete-complete-back-modal-ok");
          function showModal() {
            if (modal) {
              modal.hidden = false;
            }
          }
          function hideModal() {
            if (modal) {
              modal.hidden = true;
            }
          }
          if (okBtn) {
            okBtn.addEventListener("click", hideModal);
          }
          history.pushState({ noBack: true }, "", location.href);
          window.addEventListener("popstate", function () {
            showModal();
            history.pushState({ noBack: true }, "", location.href);
          });
        }
        blockBackNavigation();

        var P = window.GraffordBookingPricing;
        var ROOM_LABEL = { G1: "G1", G2: "G2", G3: "G3", G4: "G4" };
        var saved = null;
        try {
          saved = JSON.parse(
            sessionStorage.getItem("graffordDeleteCompleteData") || "null",
          );
        } catch (e) {
          saved = null;
        }
        var orderNo = (saved && saved.orderNo) || "—";
        var room = (saved && saved.room) || "";
        var checkIn = (saved && saved.checkIn) || "";
        var checkOut = (saved && saved.checkOut) || "";
        var extraGuests =
          parseInt((saved && saved.extraGuests) || "0", 10) || 0;
        var name = (saved && saved.name) || "—";
        var contact = (saved && saved.contact) || "—";
        var amount = parseInt((saved && saved.amount) || "0", 10) || 0;

        function formatKRW(n) {
          return Number(n || 0).toLocaleString("ko-KR") + "원";
        }

        function getDiscountedAmount() {
          if (P && checkIn && checkOut) {
            var quote = P.computeStay(room, checkIn, checkOut, extraGuests);
            if (quote && quote.nights > 0) {
              return quote.discountedGrandTotal || 0;
            }
          }
          return amount;
        }
        var discountedAmount = getDiscountedAmount();

        document.getElementById("done-order").textContent = orderNo;
        document.getElementById("done-room").textContent =
          ROOM_LABEL[room] || room || "—";
        document.getElementById("done-schedule").textContent =
          (checkIn || "—") + " ~ " + (checkOut || "—");
        document.getElementById("done-name").textContent = name;
        document.getElementById("done-contact").textContent = contact;
        document.getElementById("done-amount").textContent =
          formatKRW(discountedAmount);
      });
    </script>
    <script defer src="js/grafford-page-fade.js"></script>
    <script src="js/site-business-footer.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        window.initSiteBusinessFooter({
          instagram: {

            "주소 : 제주특별자치도 서귀포시 토산중앙로 22",
            "사업자등록번호 : 123-45-67890",
            "전화 : 010-1234-5678",
            "이메일 : info@grafford.com",
            " ",
            "© 2026 GRAFFORD. all rights reserved.",
          ],
        });
      });
    </script>
  </body>
</html>
