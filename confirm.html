<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/LOGO-transparent.png" type="image/png" />
    <title>결제하기 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="grafford-react-fade-root"></div>
    <nav class="site-nav top-right-nav">
      <a href="index.html" class="nav-logo" aria-label="홈으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <a href="STORY.html">STORY</a>
      <a href="ROOMS.html">ROOMS</a>
      <a href="FACILITIES.html">FACILITIES</a>
      <a href="RESERVATION.html">RESERVATION</a>
    </nav>

    <main class="content-section confirm-page">
      <h1 class="confirm-title">결제하기</h1>

      <form
        class="confirm-form checkout-form"
        id="confirm-form"
        action="payment.html"
        method="get"
      >
        <input type="hidden" name="room" id="f-room" />
        <input type="hidden" name="checkIn" id="f-checkin" />
        <input type="hidden" name="checkOut" id="f-checkout" />
        <input type="hidden" name="nights" id="f-nights" value="0" />
        <input type="hidden" name="extraGuests" id="f-extra-guests" value="0" />
        <input type="hidden" name="totalAmount" id="f-total-amount" value="0" />

        <section class="confirm-section" aria-labelledby="sec-booking">
          <h2 class="confirm-section-title" id="sec-booking">예약 정보</h2>
          <div class="confirm-booking-card">
            <img
              class="confirm-room-thumb"
              id="booking-room-img"
              src="images/A00.jpg"
              alt=""
              width="120"
              height="90"
              decoding="async"
            />
            <div class="confirm-booking-details">
              <p class="confirm-room-name" id="booking-room-name"></p>
              <p class="confirm-schedule" id="booking-schedule"></p>
              <p class="confirm-line-price" id="booking-line-price"></p>
            </div>
          </div>
        </section>

        <section class="confirm-section" aria-labelledby="sec-guest">
          <h2 class="confirm-section-title" id="sec-guest">예약자 정보</h2>
          <p class="confirm-info-text">
            예약 확정 및 안내를 위해 정확한 이름과 연락 가능한 번호를 입력해
            주세요.<br />
            입력하신 정보는 예약 처리·고객 응대 목적으로만 사용되며,<br />
            결제 완료 후 변경은 고객센터로 문의해 주세요.
          </p>
          <label class="confirm-label">
            성함
            <input
              type="text"
              name="guestName"
              id="f-name"
              required
              autocomplete="name"
              placeholder="명탐정코난"
            />
          </label>
          <label class="confirm-label">
            연락처
            <input
              type="tel"
              name="contact"
              id="f-contact"
              required
              autocomplete="tel"
              inputmode="numeric"
              maxlength="13"
              placeholder="010-1234-5678"
              title="숫자 11자리 (010-1234-5678 형식)"
              pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
            />
          </label>
        </section>

        <section class="confirm-section" aria-labelledby="sec-total">
          <h2 class="confirm-section-title" id="sec-total">최종 금액</h2>
          <div class="confirm-total-box">
            <div class="confirm-breakdown" id="confirm-breakdown"></div>
            <p class="confirm-total-amount-wrap">
              <span class="confirm-total-label">합계</span>
              <strong class="confirm-total-amount" id="confirm-total-display"
                >—</strong
              >
            </p>
          </div>
        </section>

        <section class="confirm-section" aria-labelledby="sec-pay">
          <h2 class="confirm-section-title" id="sec-pay">결제 수단</h2>
          <fieldset class="confirm-fieldset">
            <legend class="visually-hidden">결제 수단 선택</legend>
            <label class="confirm-radio">
              <input type="radio" name="paymentMethod" value="card" required />
              신용카드
            </label>
            <label class="confirm-radio">
              <input type="radio" name="paymentMethod" value="naver" />
              네이버페이
            </label>
            <label class="confirm-radio">
              <input type="radio" name="paymentMethod" value="bank" />
              무통장입금
            </label>
          </fieldset>
        </section>

        <section class="confirm-section" aria-labelledby="sec-agree">
          <h2 class="confirm-section-title" id="sec-agree">전체 동의</h2>
          <label class="confirm-check confirm-check--all">
            <input type="checkbox" id="agree-all" />
            전체 동의
          </label>
          <div class="confirm-agree-list">
            <label class="confirm-check">
              <input
                type="checkbox"
                name="agreePrivacy"
                id="agree-privacy"
                value="1"
                required
              />
              (필수) 개인정보 수집 및 이용 동의
            </label>
            <label class="confirm-check">
              <input
                type="checkbox"
                name="agreePurchase"
                id="agree-purchase"
                value="1"
                required
              />
              (필수) 구매조건 확인 및 결제 진행 동의
            </label>
          </div>
        </section>

        <div class="confirm-actions">
          <button type="submit" class="btn confirm-pay-submit">결제하기</button>
        </div>
      </form>

      <p class="confirm-back">
        <a href="RESERVATION.html">예약으로 돌아가기</a>
      </p>

      <footer
        id="site-business-footer-mount"
        class="site-footer site-business-footer"
        hidden
      ></footer>
    </main>

    <script src="js/booking-pricing.js"></script>
    <script src="js/booking-reservations.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var P = window.GraffordBookingPricing;
        var ROOM_LABEL = {
          A: "객실 A",
          B: "객실 B",
          C: "객실 C",
          D: "객실 D",
        };

        var params = new URLSearchParams(window.location.search);
        var roomRaw = (params.get("room") || "A").toUpperCase();
        if (!P) {
          roomRaw = "A";
        } else if (!P.ROOM_WEEKDAY_BASE.hasOwnProperty(roomRaw)) {
          roomRaw = "A";
        }
        var checkIn = params.get("checkIn") || "";
        var checkOut = params.get("checkOut") || "";
        var extraGuestsRaw = parseInt(params.get("extraGuests") || "0", 10);
        var extraGuests = P ? P.clampExtra(roomRaw, extraGuestsRaw) : 0;

        function formatKRW(n) {
          return n.toLocaleString("ko-KR") + "원";
        }

        function formatDisplayYMD(s) {
          if (!P || !P.parseYMD(s)) {
            return s || "—";
          }
          var p = s.split("-");
          return p[0] + "." + p[1] + "." + p[2];
        }

        var quote =
          P && checkIn && checkOut
            ? P.computeStay(roomRaw, checkIn, checkOut, extraGuests)
            : {
                nights: 0,
                baseNightly: P ? P.ROOM_WEEKDAY_BASE[roomRaw] : 0,
                baseTotal: 0,
                weekendNights: 0,
                weekendSurcharge: 0,
                extraGuestTotal: 0,
                grandTotal: 0,
                extraGuests: extraGuests,
              };

        document.getElementById("f-room").value = roomRaw;
        document.getElementById("f-checkin").value = checkIn;
        document.getElementById("f-checkout").value = checkOut;
        document.getElementById("f-nights").value = String(quote.nights);
        document.getElementById("f-extra-guests").value = String(
          quote.extraGuests,
        );
        document.getElementById("f-total-amount").value = String(quote.grandTotal);

        var imgEl = document.getElementById("booking-room-img");
        imgEl.src = "images/" + roomRaw + "00.jpg";
        imgEl.alt = ROOM_LABEL[roomRaw] + " 대표 이미지";

        document.getElementById("booking-room-name").textContent =
          ROOM_LABEL[roomRaw];

        var schedEl = document.getElementById("booking-schedule");
        if (checkIn && checkOut && quote.nights > 0) {
          schedEl.textContent =
            "체크인 " +
            formatDisplayYMD(checkIn) +
            " · 체크아웃 " +
            formatDisplayYMD(checkOut) +
            " (" +
            quote.nights +
            "박" +
            (quote.extraGuests > 0
              ? " · 추가 인원 " + quote.extraGuests + "명"
              : "") +
            ")";
        } else {
          schedEl.textContent =
            "일정이 없습니다. 예약 페이지에서 일정을 선택한 후 다시 들어와 주세요.";
        }

        document.getElementById("booking-line-price").textContent =
          "평일 1박 " +
          formatKRW(quote.baseNightly) +
          " · 금·토 박당 +" +
          formatKRW(P ? P.WEEKEND_SURCHARGE_PER_NIGHT : 30000);

        var breakdownEl = document.getElementById("confirm-breakdown");
        var totalDisplayEl = document.getElementById("confirm-total-display");
        breakdownEl.innerHTML = "";
        function addBreakLine(text) {
          var p = document.createElement("p");
          p.className = "confirm-total-line";
          p.textContent = text;
          breakdownEl.appendChild(p);
        }
        if (quote.nights > 0 && P) {
          addBreakLine(
            ROOM_LABEL[roomRaw] +
              " (평일 기준) " +
              formatKRW(quote.baseNightly) +
              " × " +
              quote.nights +
              "박 = " +
              formatKRW(quote.baseTotal),
          );
          if (quote.weekendSurcharge > 0) {
            addBreakLine(
              "주말(금·토) 추가 " +
                formatKRW(P.WEEKEND_SURCHARGE_PER_NIGHT) +
                " × " +
                quote.weekendNights +
                "박 = " +
                formatKRW(quote.weekendSurcharge),
            );
          }
          if (quote.extraGuestTotal > 0) {
            addBreakLine(
              "인원 추가 " +
                formatKRW(P.EXTRA_PER_PERSON_PER_NIGHT) +
                " × " +
                quote.extraGuests +
                "명 × " +
                quote.nights +
                "박 = " +
                formatKRW(quote.extraGuestTotal),
            );
          }
          totalDisplayEl.textContent = formatKRW(quote.grandTotal);
        } else {
          addBreakLine(
            "투숙 일수를 계산할 수 없습니다. 체크인·체크아웃을 확인해 주세요.",
          );
          totalDisplayEl.textContent = "—";
        }

        var agreeAll = document.getElementById("agree-all");
        var agreePrivacy = document.getElementById("agree-privacy");
        var agreePurchase = document.getElementById("agree-purchase");
        var syncing = false;

        function syncAllFromChildren() {
          if (syncing) {
            return;
          }
          agreeAll.checked = agreePrivacy.checked && agreePurchase.checked;
        }

        agreeAll.addEventListener("change", function () {
          syncing = true;
          agreePrivacy.checked = agreeAll.checked;
          agreePurchase.checked = agreeAll.checked;
          syncing = false;
        });

        agreePrivacy.addEventListener("change", syncAllFromChildren);
        agreePurchase.addEventListener("change", syncAllFromChildren);

        syncAllFromChildren();

        var contactInput = document.getElementById("f-contact");
        if (contactInput) {
          function formatPhoneKRMobile(value) {
            var d = String(value || "").replace(/\D/g, "").slice(0, 11);
            if (d.length <= 3) {
              return d;
            }
            if (d.length <= 7) {
              return d.slice(0, 3) + "-" + d.slice(3);
            }
            return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
          }
          contactInput.addEventListener("input", function () {
            var cur = contactInput.value;
            var next = formatPhoneKRMobile(cur);
            if (cur !== next) {
              contactInput.value = next;
            }
          });
          contactInput.addEventListener("blur", function () {
            contactInput.value = formatPhoneKRMobile(contactInput.value);
          });
        }

        var confirmForm = document.getElementById("confirm-form");
        var paySubmitBtn = confirmForm.querySelector(".confirm-pay-submit");
        var R = window.GraffordReservations;

        function bookingApiUrl() {
          if (
            typeof window !== "undefined" &&
            window.__GRAFFORD_API_BASE__
          ) {
            return (
              String(window.__GRAFFORD_API_BASE__).replace(/\/$/, "") +
              "/api/reservations"
            );
          }
          return "/api/reservations";
        }

        confirmForm.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!confirmForm.checkValidity()) {
            confirmForm.reportValidity();
            return;
          }
          var payInput = confirmForm.querySelector(
            'input[name="paymentMethod"]:checked',
          );
          if (!payInput) {
            window.alert("결제 수단을 선택해 주세요.");
            return;
          }
          var nights = parseInt(
            document.getElementById("f-nights").value,
            10,
          );
          if (!nights || nights < 1) {
            window.alert(
              "체크인·체크아웃이 올바르지 않습니다. 예약 페이지에서 다시 선택해 주세요.",
            );
            return;
          }
          if (!R || typeof R.generateOrderNumber !== "function") {
            window.alert(
              "예약 처리 모듈을 불러올 수 없습니다. 새로고침 후 다시 시도해 주세요.",
            );
            return;
          }

          var guestName = document.getElementById("f-name").value.trim();
          var contact = document.getElementById("f-contact").value.trim();
          if (!/^\d{3}-\d{4}-\d{4}$/.test(contact)) {
            window.alert(
              "연락처는 010-1234-5678 형식(숫자 11자리)으로 입력해 주세요.",
            );
            return;
          }
          var orderNumber = R.generateOrderNumber();
          var room = document.getElementById("f-room").value;
          var checkIn = document.getElementById("f-checkin").value;
          var checkOut = document.getElementById("f-checkout").value;
          var extraGuests =
            parseInt(
              document.getElementById("f-extra-guests").value,
              10,
            ) || 0;
          var totalAmount =
            parseInt(
              document.getElementById("f-total-amount").value,
              10,
            ) || 0;
          var guestCount = Math.min(50, Math.max(1, 2 + extraGuests));

          var payload = {
            reservationNumber: orderNumber,
            guestName: guestName,
            contact: contact,
            roomType: room,
            checkIn: checkIn,
            checkOut: checkOut,
            stayNights: nights,
            extraGuests: extraGuests,
            totalAmount: totalAmount,
            paymentMethod: payInput.value,
            guestCount: guestCount,
          };

          if (paySubmitBtn) {
            paySubmitBtn.disabled = true;
          }

          fetch(bookingApiUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then(function (resp) {
              return resp.json().then(function (data) {
                return { ok: resp.ok, status: resp.status, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                var msg =
                  (result.data && result.data.error) ||
                  "저장에 실패했습니다. (" + result.status + ")";
                if (result.data && result.data.code) {
                  msg += " [코드: " + result.data.code + "]";
                }
                throw new Error(msg);
              }
              var record = {
                orderNumber: orderNumber,
                guestName: guestName,
                contact: contact,
                room: room,
                checkIn: checkIn,
                checkOut: checkOut,
                nights: nights,
                extraGuests: extraGuests,
                totalAmount: totalAmount,
                paymentMethod: payInput.value,
                createdAt: Date.now(),
              };

              if (payInput.value === "bank") {
                R.save(record);
                window.location.href =
                  "reserve-complete.html?orderNo=" +
                  encodeURIComponent(orderNumber);
              } else {
                var fd = new FormData(confirmForm);
                var params = new URLSearchParams(fd);
                params.set("orderNo", orderNumber);
                window.location.href =
                  "payment.html?" + params.toString();
              }
            })
            .catch(function (err) {
              window.alert(
                "예약 정보를 서버(Vercel DB)에 저장하지 못했습니다.\n" +
                  (err && err.message ? err.message : "네트워크 오류") +
                  "\n\n※ 로컬에서 HTML 파일만 연 경우에는 API가 없습니다. `vercel dev`로 실행하거나 배포된 사이트 주소에서 다시 시도해 주세요.",
              );
            })
            .finally(function () {
              if (paySubmitBtn) {
                paySubmitBtn.disabled = false;
              }
            });
        });
      });
    </script>
    <script defer src="js/grafford-page-fade.js"></script>
    <script src="js/site-business-footer.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        window.initSiteBusinessFooter({
          instagram: {
            href: "https://www.instagram.com/p/DWaqvQKkzye/",
            imgSrc: "images/insta.png",
          },
          lines: [
            "대표 : GRAFFORD",
            "주소 : 제주특별자치도 서귀포시 토산중앙로 22",
            "사업자등록번호 : 123-45-67890",
            "전화 : 010-1234-5678",
            "이메일 : info@grafford.com",
            " ",
            "© 2026 GRAFFORD. all rights reserved.",
          ],
        });
      });
    </script>
  </body>
</html>
