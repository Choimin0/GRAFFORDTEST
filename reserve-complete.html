    <meta charset="UTF-8" />

    <title>예약 완료 - GRAFFORD</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/mobile-nav.js" defer></script>
  </head>
  <body>
    <div id="grafford-react-fade-root"></div>
    <nav class="site-nav top-right-nav">
      <a href="index.html" class="nav-logo" aria-label="홈으로 이동">
        <img src="images/LOGO.png" alt="GRAFFORD LOGO" />
      </a>
      <button
        type="button"
        class="mobile-menu-btn"
        aria-label="메뉴 열기"
        aria-controls="mobile-nav-drawer"
        aria-expanded="false"
      >
        MENU
      </button>
      <div class="mobile-nav-backdrop" hidden></div>
      <aside
        id="mobile-nav-drawer"
        class="mobile-nav-drawer"
        aria-hidden="true"
      >
        <a href="STORY.html">STORY</a>
        <a href="GROUND.html">GROUND</a>
        <a href="FACILITIES.html">FACILITIES</a>
        <a href="RESERVATION.html">RESERVATION</a>
      </aside>
      <div class="desktop-nav-links" aria-label="데스크톱 메뉴">
        <a href="STORY.html">STORY</a>
        <a href="GROUND.html">GROUND</a>
        <a href="FACILITIES.html">FACILITIES</a>
        <a href="RESERVATION.html">RESERVATION</a>
      </div>
    </nav>

    <main class="content-section confirm-page reserve-complete-page">
      <h1 class="confirm-title">예약이 완료되었습니다</h1>
      <p class="confirm-summary">
        무통장입금을 선택하신 건은 아래 주문번호(예약번호)로 접수되었습니다.<br />
        입금 후 입금 확인 후 최종 확정 안내를 드립니다.
      </p>
      <div class="confirm-total-box reserve-complete-order-box">
        <p class="reserve-complete-label">주문번호 · 예약번호</p>
        <div class="reserve-complete-order-row">
          <p class="reserve-complete-order" id="complete-order-no">—</p>
          <button
            type="button"
            class="reserve-complete-copy-btn"
            id="complete-copy-btn"
            aria-label="예약번호 복사"
            title="복사"
            hidden
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
          </button>
        </div>
      </div>
      <p class="confirm-back">
        <a href="reserveinfo.html" id="complete-link-lookup">예약 조회</a>
        ·
        <a href="RESERVATION.html">예약 홈</a>
      </p>
      <footer
        id="site-business-footer-mount"
        class="site-footer site-business-footer"
        hidden
      ></footer>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var params = new URLSearchParams(window.location.search);
        var orderNo = params.get("orderNo") || "";
        var orderEl = document.getElementById("complete-order-no");
        var copyBtn = document.getElementById("complete-copy-btn");
        orderEl.textContent = orderNo || "번호를 확인할 수 없습니다.";
        if (orderNo && copyBtn) {
          copyBtn.hidden = false;
          copyBtn.addEventListener("click", function () {
            function copiedFeedback() {
              var prev = copyBtn.getAttribute("aria-label");
              copyBtn.setAttribute("aria-label", "복사되었습니다");
              copyBtn.title = "복사되었습니다";
              window.setTimeout(function () {
                copyBtn.setAttribute("aria-label", "예약번호 복사");
                copyBtn.title = "복사";
              }, 2000);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(orderNo).then(copiedFeedback);
            } else {
              var ta = document.createElement("textarea");
              ta.value = orderNo;
              ta.setAttribute("readonly", "");
              ta.style.position = "fixed";
              ta.style.left = "-9999px";
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand("copy");
                copiedFeedback();
              } catch (e) {}
              document.body.removeChild(ta);
            }
          });
        }
        var lookupLink = document.getElementById("complete-link-lookup");
        if (lookupLink) {
          lookupLink.href = orderNo
            ? "reserveinfo.html?orderNo=" + encodeURIComponent(orderNo)
            : "reserveinfo.html";
        }
      });
    </script>
    <script defer src="js/grafford-page-fade.js"></script>
    <script src="js/site-business-footer.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        window.initSiteBusinessFooter({
          instagram: {
            href: "https://www.instagram.com/p/DWaqvQKkzye/",
            imgSrc: "images/insta.png",
          },
          lines: [
            "대표 : GRAFFORD",
            "주소 : 제주특별자치도 서귀포시 토산중앙로 22",
            "사업자등록번호 : 123-45-67890",
            "전화 : 010-1234-5678",
            "이메일 : info@grafford.com",
            " ",
            "© 2026 GRAFFORD. all rights reserved.",
          ],
        });
      });
    </script>
  </body>
</html>
